name: Temporary club-profile inventory
on:
  push:
    branches:
      - research/club-profiles-20261017
    paths:
      - .github/workflows/club-profile-inventory-temporary.yml
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inventory missing individual strengths
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {getP1HeritageForPlayer, applyP1SourceClaims} from './src/football-player-source-claims-p1.js';
          import {getP2SourceRecord, applyP2SourceClaims} from './src/football-player-source-claims-p2.js';
          import {getSourceDepthRecord, applySourceDepthClaims} from './src/football-player-source-claims-depth.js';
          const raw=JSON.parse(fs.readFileSync('data/football_players.json','utf8')).players;
          const effective=applySourceDepthClaims(applyP2SourceClaims(applyP1SourceClaims(raw)));
          const targets=['molde','stromsgodset','haugesund'];
          const result={};
          for(let i=0;i<raw.length;i++){
            const p=raw[i], e=effective[i]; if ((e.strengths||[]).length) continue;
            for(const a of p.clubAffiliations||[]){
              if(!targets.includes(a.clubId))continue;
              (result[a.clubId]??=[]).push({
                id:p.id,name:p.name,era:p.era||null,
                affiliation:a.source,relation:a.relation,
                p1:!!getP1HeritageForPlayer(p),p2:!!getP2SourceRecord(p),
                depth:!!getSourceDepthRecord(p),
                positions:p.naturalPositions,
                rawStrengths:p.strengths
              });
            }
          }
          for(const c of targets){
            const list=result[c]||[];
            console.log('INVENTORY '+c+' MISSING '+list.length);
            list.sort((a,b)=>((a.affiliation==='belagt')?0:1)-((b.affiliation==='belagt')?0:1));
            for(const p of list)console.log('CANDIDATE '+c+' '+JSON.stringify(p));
          }
          NODE
