name: Diagnose rollover save metadata

on:
  push:
    branches:
      - test/rollover-save-metadata-v1

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run focused rollover metadata proof
        run: npx playwright test tests/browser/manager-rollover-save-metadata-v1.spec.js
