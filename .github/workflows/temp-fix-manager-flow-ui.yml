name: Temporary fix manager flow UI

on:
  push:
    branches:
      - agent/manager-matchday-scene-v1
    paths:
      - .github/workflows/temp-fix-manager-flow-ui.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/manager-matchday-scene-v1
          fetch-depth: 0

      - name: Update stale matchday assertions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/simulate-manager-flow-ui.mjs')
          text = path.read_text(encoding='utf-8')

          anchor = 'const shellSource = readFileSync(join(root, "src/ui/manager-shell-elements.js"), "utf8");\n'
          addition = anchor + 'const matchdaySource = readFileSync(join(root, "src/ui/manager-matchday-presentation.js"), "utf8");\n'
          if 'const matchdaySource =' not in text:
              if anchor not in text:
                  raise SystemExit('source anchor not found')
              text = text.replace(anchor, addition, 1)

          old = '''  check("Kampfanen har tydelig kampdag-gate", app.includes("renderMatchdayGate") && app.includes("createMatchdaySceneModel") && app.includes("scene.primaryAction") && app.includes("scene.statusLabel"));
          check("Kampfanen viser CTA-er for states", app.includes("Spill kamp") && app.includes("Fortsett kampen") && app.includes("Forbered neste kamp"));'''
          new = '''  check(
            "Kampfanen har tydelig kampdag-gate",
            app.includes("renderManagerMatchdayCommand")
              && app.includes("createMatchdaySceneModel")
              && matchdaySource.includes("resolvePhase")
              && matchdaySource.includes("statusLabel")
              && matchdaySource.includes("primaryAction")
          );
          check(
            "Kampfanen viser CTA-er for states",
            matchdaySource.includes('action: "Fullfør forberedelsene"')
              && matchdaySource.includes('action: "Start kampen"')
              && matchdaySource.includes('action: "Gå til kampbildet"')
              && matchdaySource.includes('action: "Åpne kampanalysen"')
          );'''
          if old not in text:
              raise SystemExit('stale assertion block not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

          node scripts/simulate-manager-flow-ui.mjs
          node scripts/simulate-manager-matchday-scene-v1.mjs

      - name: Commit focused fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/simulate-manager-flow-ui.mjs
          git commit -m "test: oppdater kampdagforventninger"
          git push origin HEAD:agent/manager-matchday-scene-v1
