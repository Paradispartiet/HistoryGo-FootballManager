name: Temporary fix manager flow UI

on:
  push:
    branches:
      - agent/manager-matchday-scene-v1
    paths:
      - .github/workflows/temp-fix-manager-flow-ui.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/manager-matchday-scene-v1
          fetch-depth: 0

      - name: Update stale matchday assertions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('scripts/simulate-manager-flow-ui.mjs')
          text = path.read_text(encoding='utf-8')

          anchor = 'const shellSource = readFileSync(join(root, "src/ui/manager-shell-elements.js"), "utf8");'
          source_line = 'const matchdaySource = readFileSync(join(root, "src/ui/manager-matchday-presentation.js"), "utf8");'
          if source_line not in text:
              if anchor not in text:
                  raise SystemExit('source anchor not found')
              text = text.replace(anchor, anchor + '\n' + source_line, 1)

          gate_replacement = '''  check(
            "Kampfanen har tydelig kampdag-gate",
            app.includes("renderManagerMatchdayCommand")
              && app.includes("createMatchdaySceneModel")
              && matchdaySource.includes("resolvePhase")
              && matchdaySource.includes("statusLabel")
              && matchdaySource.includes("primaryAction")
          );'''
          cta_replacement = '''  check(
            "Kampfanen viser CTA-er for states",
            matchdaySource.includes('action: "Fullfør forberedelsene"')
              && matchdaySource.includes('action: "Start kampen"')
              && matchdaySource.includes('action: "Gå til kampbildet"')
              && matchdaySource.includes('action: "Åpne kampanalysen"')
          );'''

          text, gate_count = re.subn(
              r'^\s*check\("Kampfanen har tydelig kampdag-gate".*?;\s*$',
              gate_replacement,
              text,
              count=1,
              flags=re.MULTILINE,
          )
          text, cta_count = re.subn(
              r'^\s*check\("Kampfanen viser CTA-er for states".*?;\s*$',
              cta_replacement,
              text,
              count=1,
              flags=re.MULTILINE,
          )
          if gate_count != 1 or cta_count != 1:
              raise SystemExit(f'assertion replacements failed: gate={gate_count}, cta={cta_count}')

          path.write_text(text, encoding='utf-8')
          PY

          node scripts/simulate-manager-flow-ui.mjs
          node scripts/simulate-manager-matchday-scene-v1.mjs

      - name: Commit focused fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/simulate-manager-flow-ui.mjs
          git commit -m "test: oppdater kampdagforventninger"
          git push origin HEAD:agent/manager-matchday-scene-v1
