name: Pors P2 one-shot import

on:
  push:
    branches:
      - agent/pors-p2-heritage

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/pors-p2-heritage
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Import Pors source population
        run: node scripts/import-pors-p2.mjs

      - name: Materialize canonical club affiliations
        run: node scripts/sync-club-affiliations.mjs --write

      - name: Targeted data gates
        run: |
          node scripts/sync-club-affiliations.mjs
          npm run audit:clubs
          npm run audit:attributes
          npm run sim:club-squad
          node scripts/audit-p1-source-claims.mjs

      - name: Commit generated canonical data and remove migration harness
        run: |
          rm scripts/import-pors-p2.mjs
          rm .github/workflows/pors-p2-import.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/football_players.json data/football_clubs.json data/football_unlocks.json scripts/import-pors-p2.mjs .github/workflows/pors-p2-import.yml
          git commit -m "Importer Pors P2-arv i canonical spillerkatalog"
          git push origin HEAD:agent/pors-p2-heritage
