name: Strømsgodset catalogue source pass (one-off)

on:
  push:
    branches:
      - content/stromsgodset-affiliation-depth-20261018
    paths:
      - .github/workflows/stromsgodset-catalogue-once.yml

permissions:
  contents: write

jobs:
  apply-source-records:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply 16 source-backed affiliation updates to canonical catalogue
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const file = 'data/football_players.json';
          const original = fs.readFileSync(file, 'utf8');
          const catalogue = JSON.parse(original);
          const ledger = JSON.parse(fs.readFileSync('data/research/stromsgodset-affiliations-2026-10-18.json', 'utf8'));
          assert.equal(ledger.clubId, 'stromsgodset');
          assert.equal(ledger.entries.length, 16);
          const map = new Map(catalogue.players.map(p => [p.id, p]));
          let changed = 0;
          for (const entry of ledger.entries) {
            const p = map.get(entry.playerId);
            assert.ok(p, entry.playerId + ': unknown ID');
            const aff = p.clubAffiliations?.find(a => a.clubId === 'stromsgodset' && a.relation === 'played_for');
            assert.ok(aff, entry.playerId + ': missing played_for');
            assert.ok(['utledet', 'belagt'].includes(aff.source), entry.playerId + ': unexpected source');
            assert.ok(/^https:\/\//.test(entry.sourceUrl), entry.playerId + ': missing source URL');
            if (aff.source === 'utledet') {
              aff.source = 'belagt';
              if (p.clubStatusSource?.marienlyst_stadion === 'utledet') p.clubStatusSource.marienlyst_stadion = 'belagt';
              changed++;
            }
          }
          const keeper = map.get('ole_johnny_friise');
          assert.ok(keeper && keeper.name === 'Ole Johnny Friise');
          assert.equal(keeper.clubAffiliations.some(a => a.clubId === 'stromsgodset' && a.source === 'belagt'), true);
          if (keeper.naturalPositions.join(',') === 'CM') {
            assert.deepEqual(keeper.usablePositions, ['DM', 'AM', 'ST']);
            Object.assign(keeper, {
              naturalPositions: ['GK'], usablePositions: [], poorFits: ['ST', 'AM', 'LW', 'RW'],
              archetypeIds: ['classic_keeper'], archetypes: ['shot_stopper'],
              needs: ['clear_defensive_line','protected_box'], preferredRoles: ['classic_keeper'],
              likesTactics: ['structured_build_up'], dislikesTactics: ['high_line'],
              warningWhenMisused: 'Friise trenger en tydelig forsvarslinje foran seg.'
            });
            changed++;
          } else {
            assert.deepEqual(keeper.naturalPositions, ['GK']);
          }
          assert.equal(new Set(catalogue.players.map(p => p.id)).size, catalogue.players.length);
          const after = JSON.stringify(catalogue, null, 2) + '\n';
          if (after !== original) fs.writeFileSync(file, after);
          console.log(JSON.stringify({updatedAffiliations: changed, uniquePlayerIds: catalogue.players.length, catalogueChanged: after !== original}));
          NODE
      - name: Commit generated canonical file only
        run: |
          if git diff --quiet -- data/football_players.json; then
            echo 'No catalogue changes necessary.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/football_players.json
          git commit -m 'data(stromsgodset): sync verified affiliations and Friise goalkeeper role'
          git push origin HEAD:content/stromsgodset-affiliation-depth-20261018
