name: Manager ground flow dead-end audit fix

on:
  push:
    branches:
      - agent/manager-grunnflyt-v1

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/manager-grunnflyt-v1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Migrate dead-end audit to authoritative readiness
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/audit-dead-ends.mjs')
          source = path.read_text()

          anchor = 'const subsEngine = readFileSync(join(root, "src/football-substitutions.js"), "utf8");\n'
          replacement = anchor + 'const readinessEngine = readFileSync(join(root, "src/football-matchday-readiness.js"), "utf8");\n'
          assert source.count(anchor) == 1
          source = source.replace(anchor, replacement)

          old = '''// ---- 7) Kamp kan ikke startes uten lag + trening ---------------------------
stage("7. Kamp-gating");
{
  check(
    "playMatchday krever kampklar tropp + valgt trening",
    /getMatchdayReadiness\\([^)]*\\)\\.isReady\\s*\\|\\|\\s*\\(!state\\.weeklyTrainingProgram\\?\\.programId\\s*&&\\s*!state\\.weeklyTrainingFocus\\?\\.focusId\\)/.test(app)
  );
}
'''
          new = '''// ---- 7) Kamp kan ikke startes uten lag + trening ---------------------------
stage("7. Kamp-gating");
{
  check(
    "playMatchday bruker den autoritative kampklarhetsporten",
    /function playMatchday\\(\\)\\s*\\{[\\s\\S]{0,320}const readiness = getMatchdayReadiness\\(teamFit\\);[\\s\\S]{0,360}if\\s*\\(!readiness\\.canStartMatch\\)/.test(app)
  );
  check(
    "kampklarhetsmotoren blokkerer manglende trening",
    /if\\s*\\(!input\\.hasTrainingChoice\\)\\s*\\{[\\s\\S]{0,220}"training_missing"/.test(readinessEngine)
  );
}
'''
          assert source.count(old) == 1
          source = source.replace(old, new)
          path.write_text(source)
          PY

      - name: Verify migrated contract and manager flow
        run: |
          npm ci
          npm run check:syntax
          npm run audit:flow
          npm run audit:dead-ends
          npm run sim:manager-ground-flow-v1
          npm run sim:manager-flow-ui
          npm run audit:manager-shell-v3
          npm run typecheck
          npm run build

      - name: Commit permanent audit migration
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Align dead-end audit with authoritative match readiness'
          branch: agent/manager-grunnflyt-v1
          file_pattern: scripts/audit-dead-ends.mjs
