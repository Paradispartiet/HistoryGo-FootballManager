name: Restore recruitment flow audit

on:
  push:
    branches:
      - agent/recruitment-v1
    paths:
      - .github/workflows/recruitment-v1-restore-flow-audit.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/recruitment-v1
          fetch-depth: 0
      - name: Restore main audit and patch one check
        run: |
          git checkout origin/main -- scripts/audit-flow.mjs
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/audit-flow.mjs')
          text = p.read_text()
          old = '''check(\n  "computeAvailability() trekker inn lokal tropp",\n  /getLocalStartPlayerIds\\(\\)\\.forEach/.test(app) ||\n    /computeAvailability[\\s\\S]{0,4000}getLocalStartPlayerIds\\(\\)/.test(app)\n);'''
          new = '''check(\n  "computeAvailability() trekker inn lokal tropp",\n  app.includes("const localStartPlayerIds = getLocalStartPlayerIds();")\n    && app.includes("localStartPlayerIds.forEach((playerId) =>")\n);'''
          if text.count(old) != 1:
              raise SystemExit(f'flow audit anchor count={text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Commit restored audit
        run: |
          rm .github/workflows/recruitment-v1-restore-flow-audit.yml
          git config user.name "Paradispartiet"
          git config user.email "paradispartiet@gmail.com"
          git add scripts/audit-flow.mjs .github/workflows/recruitment-v1-restore-flow-audit.yml
          git commit -m "Restore full flow audit with recruitment-safe check"
          git push origin HEAD:agent/recruitment-v1
