name: Brann canonical raw sync (one-time)
on:
  push:
    branches:
      - fix/brann-canonical-roles-source-audit-20261021
permissions:
  contents: write
jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Synchronize exactly three source-backed Brann player records
        run: node scripts/sync-brann-raw-roles.mjs --write
      - name: Commit the canonical catalog change on this branch
        run: |
          if ! git diff --quiet -- data/football_players.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/football_players.json
            git commit -m "Brann: materialize sourced positions for three canonical players"
            git push
          else
            echo "Catalog already synchronized"
          fi
