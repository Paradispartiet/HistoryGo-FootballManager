name: Temporary inbox contrast fix

on:
  push:
    branches:
      - agent/manager-office-inbox-v1
    paths:
      - .github/workflows/temp-fix-inbox-contrast.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/manager-office-inbox-v1
      - name: Make inbox panels opaque
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("style.css")
          source = path.read_text()
          old = '''.inbox-focus-panel,
          .inbox-briefing-panel,
          .inbox-queue-panel { display: grid; gap: 16px; border-color: var(--hg-border-soft); background: linear-gradient(180deg, rgba(18, 23, 34, 0.94), rgba(5, 8, 13, 0.96)); }'''
          new = '''.inbox-focus-panel,
          .inbox-briefing-panel,
          .inbox-queue-panel {
            display: grid;
            gap: 16px;
            border-color: var(--hg-border-soft);
            background: #0f131b;
          }'''
          if old not in source:
              raise SystemExit("Expected inbox panel rule was not found")
          path.write_text(source.replace(old, new, 1))
          PY
      - name: Commit contrast fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add style.css
          git commit -m "Fiks kontrast i assistentråden"
          git push origin HEAD:agent/manager-office-inbox-v1
