name: Apply Pors playable boundary v2

on:
  push:
    branches:
      - agent/pors-playable-boundary-v2

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/pors-playable-boundary-v2
          fetch-depth: 0

      - name: Materialize permanent boundary
        shell: python
        run: |
          from pathlib import Path
          import json
          import re
          import textwrap

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, content):
              Path(path).write_text(content, encoding="utf-8")

          def replace_once(path, old, new, label):
              source = read(path)
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one {label}, found {count}")
              write(path, source.replace(old, new, 1))

          def regex_once(path, pattern, replacement, label):
              source = read(path)
              updated, count = re.subn(pattern, replacement, source, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"{path}: expected one {label}, found {count}")
              write(path, updated)

          # --------------------------------------------------------------
          # Runtime: documented history and selectable simulation pool differ.
          # --------------------------------------------------------------
          replace_once(
              "src/football-club-squad.js",
              'export const CLUB_SQUAD_VERSION = "historygo-football-manager.club-squad.v5";\nexport const CLUB_PLAYER_POOL_VERSION = "historygo-football-manager.club-player-pool.v1";',
              'export const CLUB_SQUAD_VERSION = "historygo-football-manager.club-squad.v6";\nexport const CLUB_PLAYER_POOL_VERSION = "historygo-football-manager.club-player-pool.v2";',
              "club-pool version"
          )

          plays_in = '''function playsIn(player, positions) {
            return [...asArray(player?.naturalPositions), ...asArray(player?.usablePositions)]
              .some((position) => positions.includes(position));
          }'''
          replace_once(
              "src/football-club-squad.js",
              plays_in,
              plays_in + '''

          export function isSimulationReadyPlayer(player) {
            return SQUAD_GROUPS.some((group) => playsIn(player, group.positions));
          }''',
              "simulation-ready predicate"
          )

          replace_once(
              "src/football-club-squad.js",
              '''// Kompatibilitetsnavn for eksisterende UI/tester. Når clubId finnes er den''',
              '''export function listPlayableClubPoolPlayers({ clubId = null, players = [] } = {}) {
            return listClubPoolPlayers({ clubId, players }).filter(isSimulationReadyPlayer);
          }

          // Kompatibilitetsnavn for eksisterende UI/tester. Når clubId finnes er den''',
              "playable club pool export"
          )

          replace_once(
              "src/football-club-squad.js",
              '''    .filter((player) => player && !excluded.has(player.id) && (!allowed || allowed.has(player.id)))''',
              '''    .filter((player) => player && isSimulationReadyPlayer(player) && !excluded.has(player.id) && (!allowed || allowed.has(player.id)))''',
              "base-squad readiness filter"
          )

          replace_once(
              "src/football-club-squad.js",
              '''    clubStatusLabel: CLUB_STATUS_LABEL[status] || "",
            clubStatusSource: affiliation?.source || "utledet"
            };''',
              '''    clubStatusLabel: CLUB_STATUS_LABEL[status] || "",
            clubStatusSource: affiliation?.source || "utledet",
            simulationReady: isSimulationReadyPlayer(player)
            };''',
              "pool-summary readiness"
          )

          resolve_function = '''export function resolveClubSquadAccess({
            club = null, players = [], unlockedPlaceIds = [], candidateIds = null, squadSize = 15
          } = {}) {
            if (!club?.id) return null;
            const clubId = club.id;
            const homePlaceId = club.homePlaceId || null;
            const documentedPool = listClubPoolPlayers({ clubId, players });
            const pool = listPlayableClubPoolPlayers({ clubId, players });
            const unprofiledPool = documentedPool.filter((player) => !isSimulationReadyPlayer(player));
            const poolIds = new Set(pool.map((player) => player.id));
            const poolReady = pool.length >= squadSize;
            const visited = hasVisitedClubGround({ homePlaceId, unlockedPlaceIds });
            const groundName = club.ground || "klubbens bane";
            const archiveNote = unprofiledPool.length
              ? ` ${unprofiledPool.length} kildeprofiler uten dokumentert posisjon beholdes som historikkposter og kan ikke velges i laget.`
              : "";
            const common = {
              version: CLUB_SQUAD_VERSION,
              poolVersion: CLUB_PLAYER_POOL_VERSION,
              clubId,
              homePlaceId,
              groundName,
              visited,
              poolReady,
              poolSize: pool.length,
              documentedCount: documentedPool.length,
              unprofiledCount: unprofiledPool.length,
              clubPoolIds: [...poolIds],
              documentedPlayerIds: documentedPool.map((player) => player.id),
              unprofiledPlayerIds: unprofiledPool.map((player) => player.id)
            };

            if (!poolReady) {
              return {
                ...common,
                mode: "unavailable",
                heritage: [],
                heritageCount: pool.length,
                lockedCount: pool.length,
                baseSquad: [],
                headline: `${club.name} har ikke en ferdig spillbar spillerpool ennå.`,
                detail: `Klubben har ${documentedPool.length} dokumenterte spillerprofiler, men bare ${pool.length} med dokumentert posisjon. Det trengs minst ${squadSize} spillbare profiler før klubben kan overtas uten å fylle laget med spillere fra andre klubber.${archiveNote}`,
                todo: ["Dokumenter minst én posisjon per spiller før profilen gjøres valgbar i simuleringen."]
              };
            }

            if (visited) {
              return {
                ...common,
                visited: true,
                mode: "heritage",
                heritage: pool.map((player) => poolSummary(player, clubId)),
                heritageCount: pool.length,
                lockedCount: 0,
                baseSquad: [],
                headline: `Du har vært på ${groundName}. ${pool.length} spillbare ${club.name}-profiler er tilgjengelige.`,
                detail: `Klubbtilknytningen kommer fra spillerdataene, mens stadionbesøket åpner alle profiler med dokumentert posisjon.${archiveNote}`,
                todo: ["Velg blant klubbens spillbare historiske profiler når du setter troppen."]
              };
            }

            const allowed = asIdSet(candidateIds);
            const eligibleClubIds = allowed
              ? new Set([...poolIds].filter((id) => allowed.has(id)))
              : poolIds;
            const basePoolIds = eligibleClubIds.size >= squadSize ? eligibleClubIds : poolIds;
            const baseSquad = buildClubBaseSquad({
              players,
              candidateIds: basePoolIds,
              size: squadSize,
              clubId
            });
            const baseIds = new Set(baseSquad);
            const lockedCount = pool.filter((player) => !baseIds.has(player.id)).length;
            const noGround = !homePlaceId;

            return {
              ...common,
              visited: false,
              mode: "base",
              heritage: [],
              heritageCount: pool.length,
              lockedCount,
              baseSquad,
              headline: noGround
                ? `${club.name} har en spillbar spillerpool, men ingen History Go-bane koblet til ennå.`
                : `Du har ikke vært på ${groundName}.`,
              detail: noGround
                ? `Du får en ${club.name}-grunntropp med ${baseSquad.length} spillere fra klubbens egen spillbare pool. Resten åpnes når klubben får en History Go-bane og den besøkes.${archiveNote}`
                : `Du får en automatisk ${club.name}-grunntropp med ${baseSquad.length} spillere fra klubbens egen spillbare pool. De resterende ${lockedCount} spillbare profilene åpnes når du besøker ${groundName} i History Go.${archiveNote}`,
              todo: noGround
                ? ["Koble klubben til riktig History Go-bane for å gjøre resten av den spillbare klubbpoolen samlebar."]
                : [
                    `Besøk ${groundName} i History Go for å åpne resten av klubbens spillbare historiske profiler.`,
                    "Grunntroppen består bare av spillere med eksplisitt klubbtilknytning og dokumentert posisjon."
                  ]
            };
          }'''

          regex_once(
              "src/football-club-squad.js",
              r'''export function resolveClubSquadAccess\(\{[\s\S]*?\n\}\n\n// Ren og idempotent save-reparasjon\.''',
              resolve_function + "\n\n// Ren og idempotent save-reparasjon.",
              "resolveClubSquadAccess"
          )

          # --------------------------------------------------------------
          # Canonical sync: playerPoolSize is historical; ready uses playable.
          # --------------------------------------------------------------
          sync_source = r'''import assert from "node:assert/strict";
          import fs from "node:fs";

          const writeMode = process.argv.includes("--write");
          const playersUrl = new URL("../data/football_players.json", import.meta.url);
          const clubsUrl = new URL("../data/football_clubs.json", import.meta.url);
          const playerData = JSON.parse(fs.readFileSync(playersUrl, "utf8"));
          const clubData = JSON.parse(fs.readFileSync(clubsUrl, "utf8"));
          const players = Array.isArray(playerData.players) ? playerData.players : [];
          const clubs = Array.isArray(clubData.clubs) ? clubData.clubs : [];

          const AFFILIATION_SCHEMA = "historygo-football-manager.player-club-affiliations.v1";
          const POOL_SCHEMA = "historygo-football-manager.club-player-pool.v1";
          const MIN_POOL = 15;
          const SIMULATION_POSITIONS = new Set(["GK", "CB", "LB", "RB", "WB", "DM", "CM", "AM", "LW", "RW", "ST"]);

          const clubById = new Map(clubs.map((club) => [club.id, club]));
          const clubByHomePlaceId = new Map(
            clubs.filter((club) => club.homePlaceId).map((club) => [club.homePlaceId, club])
          );

          function hasSimulationPosition(player) {
            return [...(Array.isArray(player?.naturalPositions) ? player.naturalPositions : []),
              ...(Array.isArray(player?.usablePositions) ? player.usablePositions : [])]
              .some((position) => SIMULATION_POSITIONS.has(position));
          }

          function normalizedRelation(status) {
            return status === "academy_export" ? "academy" : "played_for";
          }

          function normalizeAffiliation(affiliation) {
            if (!affiliation || typeof affiliation.clubId !== "string" || !clubById.has(affiliation.clubId)) return null;
            return {
              clubId: affiliation.clubId,
              relation: typeof affiliation.relation === "string" && affiliation.relation ? affiliation.relation : "played_for",
              status: typeof affiliation.status === "string" && affiliation.status ? affiliation.status : null,
              source: affiliation.source === "belagt" ? "belagt" : "utledet"
            };
          }

          function expectedAffiliations(player) {
            const result = new Map();
            for (const raw of Array.isArray(player.clubAffiliations) ? player.clubAffiliations : []) {
              const affiliation = normalizeAffiliation(raw);
              if (affiliation) result.set(affiliation.clubId, affiliation);
            }

            const statuses = player && typeof player.clubStatus === "object" && player.clubStatus ? player.clubStatus : {};
            const sources = player && typeof player.clubStatusSource === "object" && player.clubStatusSource ? player.clubStatusSource : {};
            for (const [placeId, status] of Object.entries(statuses)) {
              const club = clubByHomePlaceId.get(placeId);
              if (!club) continue;
              const existing = result.get(club.id);
              result.set(club.id, {
                clubId: club.id,
                relation: existing?.relation || normalizedRelation(status),
                status: status || existing?.status || null,
                source: sources[placeId] === "belagt" ? "belagt" : (existing?.source || "utledet")
              });
            }
            return [...result.values()].sort((a, b) => a.clubId.localeCompare(b.clubId));
          }

          let generatedAffiliations = 0;
          for (const player of players) {
            const expected = expectedAffiliations(player);
            generatedAffiliations += expected.length;
            if (writeMode) player.clubAffiliations = expected;
            else assert.deepEqual(
              Array.isArray(player.clubAffiliations) ? player.clubAffiliations : [],
              expected,
              `${player.id}: clubAffiliations har driftet fra canonical migrering`
            );
          }

          const documentedByClub = new Map(clubs.map((club) => [club.id, 0]));
          const playableByClub = new Map(clubs.map((club) => [club.id, 0]));
          for (const player of players) {
            const seen = new Set();
            const playable = hasSimulationPosition(player);
            for (const affiliation of Array.isArray(player.clubAffiliations) ? player.clubAffiliations : []) {
              assert.ok(clubById.has(affiliation.clubId), `${player.id}: ukjent clubId ${affiliation.clubId}`);
              assert.ok(!seen.has(affiliation.clubId), `${player.id}: duplisert clubAffiliation ${affiliation.clubId}`);
              seen.add(affiliation.clubId);
              assert.ok(["played_for", "academy", "origin_club", "predecessor_club"].includes(affiliation.relation),
                `${player.id}: ukjent klubbrelasjon ${affiliation.relation}`);
              assert.ok(["belagt", "utledet"].includes(affiliation.source), `${player.id}: ugyldig kildegrad ${affiliation.source}`);
              documentedByClub.set(affiliation.clubId, (documentedByClub.get(affiliation.clubId) || 0) + 1);
              if (playable) playableByClub.set(affiliation.clubId, (playableByClub.get(affiliation.clubId) || 0) + 1);
            }
          }

          for (const club of clubs) {
            const documented = documentedByClub.get(club.id) || 0;
            const playable = playableByClub.get(club.id) || 0;
            const status = playable >= MIN_POOL ? "ready" : "pending";
            if (writeMode) {
              club.playerPoolSize = documented;
              club.playablePlayerPoolSize = playable;
              club.playerPoolStatus = status;
            } else {
              assert.equal(Number(club.playerPoolSize || 0), documented, `${club.id}: playerPoolSize har driftet`);
              assert.equal(Number(club.playablePlayerPoolSize || 0), playable, `${club.id}: playablePlayerPoolSize har driftet`);
              assert.equal(club.playerPoolStatus, status, `${club.id}: playerPoolStatus har driftet`);
            }
          }

          if (writeMode) {
            playerData.clubAffiliationSchema = AFFILIATION_SCHEMA;
            playerData.clubAffiliationVersion = 1;
            clubData.playerPoolSchema = POOL_SCHEMA;
            clubData.playerPoolVersion = 1;
          } else {
            assert.equal(playerData.clubAffiliationSchema, AFFILIATION_SCHEMA, "mangler canonical clubAffiliationSchema");
            assert.equal(playerData.clubAffiliationVersion, 1, "mangler clubAffiliationVersion 1");
            assert.equal(clubData.playerPoolSchema, POOL_SCHEMA, "mangler canonical playerPoolSchema");
            assert.equal(clubData.playerPoolVersion, 1, "mangler playerPoolVersion 1");
          }

          for (const player of players) {
            const affiliationIds = new Set((player.clubAffiliations || []).map((entry) => entry.clubId));
            for (const placeId of Object.keys(player.clubStatus || {})) {
              const club = clubByHomePlaceId.get(placeId);
              if (!club) continue;
              assert.ok(affiliationIds.has(club.id), `${player.id}: mangler eksplisitt klubbtilknytning til ${club.id}`);
            }
          }

          const readyClubs = clubs.filter((club) => club.playerPoolStatus === "ready");
          const pendingClubs = clubs.filter((club) => club.playerPoolStatus === "pending");
          assert.ok(readyClubs.length > 0, "ingen klubber har ferdig spillerpool");
          assert.ok(readyClubs.every((club) => club.playablePlayerPoolSize >= MIN_POOL), "ready-klubb med for liten spillbar pool");
          assert.ok(pendingClubs.every((club) => club.playablePlayerPoolSize < MIN_POOL), "pending-klubb med stor nok spillbar pool");

          if (writeMode) {
            fs.writeFileSync(playersUrl, `${JSON.stringify(playerData, null, 2)}\n`);
            fs.writeFileSync(clubsUrl, `${JSON.stringify(clubData, null, 2)}\n`);
          }

          console.log(JSON.stringify({
            ok: true,
            mode: writeMode ? "write" : "audit",
            players: players.length,
            affiliations: generatedAffiliations,
            readyClubs: readyClubs.length,
            pendingClubs: pendingClubs.length,
            smallestReadyPool: Math.min(...readyClubs.map((club) => club.playablePlayerPoolSize))
          }, null, 2));
          '''
          write("scripts/sync-club-affiliations.mjs", textwrap.dedent(sync_source).lstrip())

          # --------------------------------------------------------------
          # Unlocks: Pors Stadion exposes only selectable profiles.
          # --------------------------------------------------------------
          player_data = json.loads(read("data/football_players.json"))
          players = player_data["players"]
          valid_positions = {"GK", "CB", "LB", "RB", "WB", "DM", "CM", "AM", "LW", "RW", "ST"}

          def is_playable(player):
              positions = list(player.get("naturalPositions") or []) + list(player.get("usablePositions") or [])
              return any(position in valid_positions for position in positions)

          pors_documented = [
              player for player in players
              if any(row.get("clubId") == "pors" for row in player.get("clubAffiliations") or [])
          ]
          pors_playable = [player for player in pors_documented if is_playable(player)]
          if (len(pors_documented), len(pors_playable)) != (63, 16):
              raise SystemExit(f"Pors population drift: {len(pors_documented)} documented / {len(pors_playable)} playable")
          playable_ids = {player["id"] for player in pors_playable}

          unlock_data = json.loads(read("data/football_unlocks.json"))
          matches = [place for place in unlock_data.get("placeUnlocks", []) if place.get("placeId") == "pors_stadion"]
          if len(matches) != 1:
              raise SystemExit(f"Expected one pors_stadion unlock, found {len(matches)}")
          pors_place = matches[0]
          pors_place["unlocks"] = [
              unlock for unlock in pors_place.get("unlocks", [])
              if unlock.get("type") != "player_candidate" or unlock.get("targetId") in playable_ids
          ]
          retained = {unlock.get("targetId") for unlock in pors_place["unlocks"] if unlock.get("type") == "player_candidate"}
          if retained != playable_ids:
              raise SystemExit(f"Pors unlock mismatch: missing={sorted(playable_ids-retained)} extra={sorted(retained-playable_ids)}")
          pors_place["notes"] = (
              "Klubbanlegg: Pors' hjemmebane i Porsgrunn. 63 dokumenterte klubbprofiler bevares i historikkatalogen; "
              "stadionet åpner bare de 16 profilene som har kildebelagt posisjon og derfor kan brukes i simuleringen."
          )
          write("data/football_unlocks.json", json.dumps(unlock_data, ensure_ascii=False, indent=2) + "\n")

          # Sync derived club counts and ready/pending state.
          # The script is run in the next workflow step after dependencies are installed.

          # --------------------------------------------------------------
          # Dedicated permanent Pors gate.
          # --------------------------------------------------------------
          audit_source = r'''import assert from "node:assert/strict";
          import fs from "node:fs";
          import {
            isSimulationReadyPlayer,
            listClubPoolPlayers,
            listPlayableClubPoolPlayers,
            resolveClubSquadAccess
          } from "../src/football-club-squad.js";

          const { clubs } = JSON.parse(fs.readFileSync(new URL("../data/football_clubs.json", import.meta.url), "utf8"));
          const { players } = JSON.parse(fs.readFileSync(new URL("../data/football_players.json", import.meta.url), "utf8"));
          const unlockData = JSON.parse(fs.readFileSync(new URL("../data/football_unlocks.json", import.meta.url), "utf8"));
          const pors = clubs.find((club) => club.id === "pors");
          assert.ok(pors, "Pors mangler i klubbkatalogen");
          assert.equal(pors.homePlaceId, "pors_stadion");

          const documented = listClubPoolPlayers({ clubId: "pors", players });
          const playable = listPlayableClubPoolPlayers({ clubId: "pors", players });
          const heritageOnly = documented.filter((player) => !isSimulationReadyPlayer(player));
          assert.equal(documented.length, 63, "Pors skal bevare 63 dokumenterte klubbprofiler");
          assert.equal(playable.length, 16, "Pors skal ha 16 profiler med dokumentert posisjon");
          assert.equal(heritageOnly.length, 47, "Pors skal ha 47 historikkprofiler uten dokumentert posisjon");
          assert.equal(Number(pors.playerPoolSize), 63);
          assert.equal(Number(pors.playablePlayerPoolSize), 16);
          assert.equal(pors.playerPoolStatus, "ready");

          const place = unlockData.placeUnlocks.find((entry) => entry.placeId === "pors_stadion");
          assert.ok(place, "pors_stadion mangler i unlock-katalogen");
          const unlockIds = place.unlocks
            .filter((entry) => entry.type === "player_candidate")
            .map((entry) => entry.targetId)
            .sort();
          const playableIds = playable.map((player) => player.id).sort();
          assert.deepEqual(unlockIds, playableIds, "Pors Stadion skal bare åpne spillbare Pors-profiler");

          const cold = resolveClubSquadAccess({
            club: pors,
            players,
            unlockedPlaceIds: [],
            candidateIds: new Set(playableIds),
            squadSize: 15
          });
          assert.equal(cold.mode, "base");
          assert.equal(cold.baseSquad.length, 15);
          assert.equal(cold.documentedCount, 63);
          assert.equal(cold.poolSize, 16);
          assert.equal(cold.unprofiledCount, 47);
          assert.ok(cold.baseSquad.every((id) => playableIds.includes(id)));

          const full = resolveClubSquadAccess({
            club: pors,
            players,
            unlockedPlaceIds: ["pors_stadion"],
            candidateIds: new Set(playableIds),
            squadSize: 15
          });
          assert.equal(full.mode, "heritage");
          assert.equal(full.heritage.length, 16);
          assert.equal(full.documentedCount, 63);
          assert.equal(full.unprofiledCount, 47);
          assert.ok(full.heritage.every((entry) => entry.simulationReady));

          const crossLinkedIds = [
            "einar_rossbach",
            "fredrik_nordkvelle",
            "erik_pedersen",
            "tor_arne_sannerholt",
            "christer_fjellstad"
          ];
          for (const id of crossLinkedIds) {
            const player = players.find((entry) => entry.id === id);
            assert.ok(player, `${id}: canonical profil mangler`);
            assert.ok(player.clubAffiliations?.some((entry) => entry.clubId === "pors"), `${id}: Pors-krysskobling mangler`);
            assert.ok(!(player.sourcePlaceIds || []).includes("pors_stadion"), `${id}: eldre sourcePlaceIds skal ikke omskrives`);
          }

          console.log(JSON.stringify({
            ok: true,
            clubId: "pors",
            documented: documented.length,
            playable: playable.length,
            heritageOnly: heritageOnly.length,
            stadiumUnlocks: unlockIds.length,
            baseSquad: cold.baseSquad.length,
            fullPool: full.heritage.length
          }, null, 2));
          '''
          write("scripts/audit-pors-heritage.mjs", textwrap.dedent(audit_source).lstrip())

          # --------------------------------------------------------------
          # Club-squad simulation rewritten against the two-pool contract.
          # --------------------------------------------------------------
          sim_source = r'''import assert from "node:assert/strict";
          import fs from "node:fs";
          import {
            CLUB_SQUAD_VERSION,
            clubAffiliationFor,
            hasVisitedClubGround,
            isSimulationReadyPlayer,
            listClubHeritagePlayers,
            listClubPoolPlayers,
            listPlayableClubPoolPlayers,
            playerAffiliatedWithClub,
            reconcileClubBaseSquadSave,
            resolveClubSquadAccess
          } from "../src/football-club-squad.js";

          const { clubs } = JSON.parse(fs.readFileSync(new URL("../data/football_clubs.json", import.meta.url), "utf8"));
          const { players } = JSON.parse(fs.readFileSync(new URL("../data/football_players.json", import.meta.url), "utf8"));
          const unlockData = JSON.parse(fs.readFileSync(new URL("../data/football_unlocks.json", import.meta.url), "utf8"));
          const placeUnlocks = Array.isArray(unlockData.placeUnlocks) ? unlockData.placeUnlocks : [];
          const placeIds = new Set(placeUnlocks.map((place) => place.placeId));
          const nationalPlaceIds = new Set(placeUnlocks.filter((place) => String(place.placeRole).includes("national")).map((place) => place.placeId));
          const candidateIds = new Set(players
            .filter((player) => !(player.sourcePlaceIds || []).some((placeId) => nationalPlaceIds.has(placeId)))
            .map((player) => player.id));
          const byId = new Map(players.map((player) => [player.id, player]));
          const clubById = new Map(clubs.map((club) => [club.id, club]));
          const REQUIRED = 15;

          let checks = 0;
          function check(name, condition, detail = "") {
            checks += 1;
            assert.ok(condition, `${name}${detail ? ` — ${detail}` : ""}`);
          }

          check("klubbtroppmotoren er v6", CLUB_SQUAD_VERSION.endsWith(".v6"), CLUB_SQUAD_VERSION);
          check("alle spiller-id-er er unike", new Set(players.map((player) => player.id)).size === players.length);
          check("alle klubb-id-er er unike", new Set(clubs.map((club) => club.id)).size === clubs.length);

          const affiliationCount = players.reduce((sum, player) => sum + (player.clubAffiliations || []).length, 0);
          check("katalogen har eksplisitte klubbtilknytninger", affiliationCount > 1000, String(affiliationCount));
          for (const player of players) {
            const seen = new Set();
            for (const affiliation of player.clubAffiliations || []) {
              check(`${player.id}: kjent klubb`, clubById.has(affiliation.clubId), affiliation.clubId);
              check(`${player.id}: unik klubbtilknytning`, !seen.has(affiliation.clubId), affiliation.clubId);
              seen.add(affiliation.clubId);
              check(`${player.id}: relasjon`, Boolean(affiliation.relation));
              check(`${player.id}: kildegrad`, ["belagt", "utledet"].includes(affiliation.source), affiliation.source);
            }
          }

          const engineSource = fs.readFileSync(new URL("../src/football-club-squad.js", import.meta.url), "utf8");
          const engineWithoutComments = engineSource
            .replace(/\/\*[\s\S]*?\*\//g, "")
            .split("\n").map((line) => line.replace(/\/\/.*$/, "")).join("\n");
          check("runtime utleder ikke medlemskap fra sourcePlaceIds", !/sourcePlaceIds/.test(engineWithoutComments));
          check("motoren er ren", !/document|localStorage|fetch\(|Date\.now|Math\.random/.test(engineWithoutComments));

          for (const club of clubs) {
            const documented = listClubPoolPlayers({ clubId: club.id, players });
            const playable = listPlayableClubPoolPlayers({ clubId: club.id, players });
            check(`${club.name}: dokumentert poolstørrelse`, Number(club.playerPoolSize || 0) === documented.length,
              `${club.playerPoolSize}/${documented.length}`);
            check(`${club.name}: spillbar poolstørrelse`, Number(club.playablePlayerPoolSize || 0) === playable.length,
              `${club.playablePlayerPoolSize}/${playable.length}`);
            check(`${club.name}: status følger spillbar pool`,
              club.playerPoolStatus === (playable.length >= REQUIRED ? "ready" : "pending"), `${club.playerPoolStatus}/${playable.length}`);
            check(`${club.name}: eksplisitt retur`, documented.every((player) => playerAffiliatedWithClub(player, club.id)));
            check(`${club.name}: spillbar delmengde`, playable.every(isSimulationReadyPlayer) && playable.length <= documented.length);
          }

          for (const club of clubs.filter((entry) => entry.homePlaceId)) {
            const explicitIds = new Set(listClubPoolPlayers({ clubId: club.id, players }).map((player) => player.id));
            const legacy = listClubHeritagePlayers({ homePlaceId: club.homePlaceId, players });
            check(`${club.name}: legacy-status er delmengde`, legacy.every((player) => explicitIds.has(player.id)));
          }

          const ready = clubs.filter((club) => club.playerPoolStatus === "ready");
          const pending = clubs.filter((club) => club.playerPoolStatus === "pending");
          check("det finnes ready-klubber", ready.length > 0, String(ready.length));
          check("det finnes pending-klubber", pending.length > 0, String(pending.length));

          for (const club of ready) {
            const access = resolveClubSquadAccess({ club, players, unlockedPlaceIds: [], candidateIds, squadSize: REQUIRED });
            const documented = listClubPoolPlayers({ clubId: club.id, players });
            const playable = listPlayableClubPoolPlayers({ clubId: club.id, players });
            const playableIds = new Set(playable.map((player) => player.id));
            check(`${club.name}: kald start er base`, access.mode === "base", access.mode);
            check(`${club.name}: 15 i grunntropp`, access.baseSquad.length === REQUIRED, String(access.baseSquad.length));
            check(`${club.name}: bare egne spillbare profiler`, access.baseSquad.every((id) => playableIds.has(id)));
            check(`${club.name}: dokumentert antall`, access.documentedCount === documented.length);
            check(`${club.name}: spillbart antall`, access.poolSize === playable.length);
            check(`${club.name}: arkivantall`, access.unprofiledCount === documented.length - playable.length);
            check(`${club.name}: låst antall`, access.lockedCount === playable.length - REQUIRED);
            check(`${club.name}: minst én keeper`, access.baseSquad.some((id) =>
              [...(byId.get(id)?.naturalPositions || []), ...(byId.get(id)?.usablePositions || [])].includes("GK")));
          }

          for (const club of pending) {
            const access = resolveClubSquadAccess({ club, players, unlockedPlaceIds: [], candidateIds, squadSize: REQUIRED });
            check(`${club.name}: pending er unavailable`, access.mode === "unavailable", access.mode);
            check(`${club.name}: ingen global fallback`, access.baseSquad.length === 0);
          }

          for (const club of ready.filter((entry) => entry.homePlaceId)) {
            check(`${club.name}: stadion finnes`, placeIds.has(club.homePlaceId), club.homePlaceId);
            check(`${club.name}: stadion er ikke nasjonalarena`, !nationalPlaceIds.has(club.homePlaceId), club.homePlaceId);
            check(`${club.name}: ubesøkt`, !hasVisitedClubGround({ homePlaceId: club.homePlaceId, unlockedPlaceIds: [] }));
            check(`${club.name}: besøkt`, hasVisitedClubGround({ homePlaceId: club.homePlaceId, unlockedPlaceIds: [club.homePlaceId] }));
            const full = resolveClubSquadAccess({ club, players, unlockedPlaceIds: [club.homePlaceId], candidateIds, squadSize: REQUIRED });
            const documented = listClubPoolPlayers({ clubId: club.id, players });
            const playable = listPlayableClubPoolPlayers({ clubId: club.id, players });
            check(`${club.name}: heritage-modus`, full.mode === "heritage", full.mode);
            check(`${club.name}: bare spillbare profiler åpnes`, full.heritage.length === playable.length);
            check(`${club.name}: historikkantall bevares`, full.documentedCount === documented.length);
            check(`${club.name}: arkivposter er ikke valgbar pool`, full.clubPoolIds.length === playable.length);
            check(`${club.name}: ingen basetropp ved full tilgang`, full.baseSquad.length === 0);
          }

          const playableSeed = players.filter(isSimulationReadyPlayer).slice(0, REQUIRED);
          const syntheticClub = { id: "synthetic_pool_only", name: "Pool FK", ground: "Ukjent bane" };
          const syntheticPlayers = playableSeed.map((player) => ({
            ...player,
            clubAffiliations: [{ clubId: syntheticClub.id, relation: "played_for", status: "squad_profile", source: "utledet" }]
          }));
          const synthetic = resolveClubSquadAccess({ club: syntheticClub, players: syntheticPlayers, unlockedPlaceIds: [], squadSize: REQUIRED });
          check("spillbar pool kan finnes uten stadion", synthetic.mode === "base" && synthetic.baseSquad.length === REQUIRED);

          const viking = clubById.get("viking");
          const vikingPool = listPlayableClubPoolPlayers({ clubId: viking.id, players });
          const vikingIds = new Set(vikingPool.map((player) => player.id));
          const vikingAccess = resolveClubSquadAccess({ club: viking, players, unlockedPlaceIds: [], candidateIds, squadSize: REQUIRED });
          assert.deepEqual(vikingAccess.baseSquad,
            resolveClubSquadAccess({ club: viking, players, unlockedPlaceIds: [], candidateIds, squadSize: REQUIRED }).baseSquad,
            "Viking-grunntroppen er ikke deterministisk");
          checks += 1;
          check("Viking-grunntroppen er bare spillbare Viking-profiler", vikingAccess.baseSquad.every((id) => vikingIds.has(id)));

          const foreignPlayer = players.find((player) => !vikingIds.has(player.id));
          const oldVikingSave = {
            enabled: true,
            source: "auto_squad",
            playerIds: [foreignPlayer.id, ...vikingAccess.baseSquad.slice(1)],
            createdAt: "2026-08-01T00:00:00.000Z"
          };
          const repaired = reconcileClubBaseSquadSave({ localStart: oldVikingSave, access: vikingAccess });
          check("gammel save repareres", repaired.changed && repaired.reason === "foreign_players", repaired.reason);
          check("reparert save er spillbar Viking", repaired.localStart.playerIds.every((id) => vikingIds.has(id)));
          check("save-reparasjon er idempotent", !reconcileClubBaseSquadSave({ localStart: repaired.localStart, access: vikingAccess }).changed);

          const app = fs.readFileSync(new URL("../src/app.js", import.meta.url), "utf8");
          check("app importerer save-reparasjonen", /reconcileClubBaseSquadSave/.test(app));
          check("localStart lagrer clubId", /clubId: typeof base\.clubId/.test(app));
          check("localStart lagrer poolVersion", /poolVersion: typeof base\.poolVersion/.test(app));

          const docs = fs.readFileSync(new URL("../docs/klubbvalg.md", import.meta.url), "utf8");
          const start = docs.indexOf("| Klubb | Bane | Historiske spillere |");
          check("arvetabellen finnes", start >= 0);
          const lines = docs.slice(start).split("\n");
          const end = lines.findIndex((line, index) => index > 0 && !line.startsWith("|"));
          const rows = [...lines.slice(0, end === -1 ? lines.length : end).join("\n")
            .matchAll(/^\| ([^|]+?) \| ([^|]+?) \| (\d+) \|$/gm)]
            .map((match) => ({ clubs: match[1].split(",").map((value) => value.trim()), count: Number(match[3]) }));
          const documentedByName = new Map(clubs.filter((club) => club.homePlaceId).map((club) =>
            [club.name, listClubPoolPlayers({ clubId: club.id, players }).length]));
          for (const row of rows.filter((entry) => entry.count > 0)) {
            for (const name of row.clubs) {
              check(`docs: ${name} finnes`, documentedByName.has(name), name);
              if (documentedByName.has(name)) check(`docs: ${name} historikkantall`, documentedByName.get(name) === row.count,
                `${documentedByName.get(name)}/${row.count}`);
            }
          }

          const pors = clubById.get("pors");
          const porsDocumented = listClubPoolPlayers({ clubId: "pors", players });
          const porsPlayable = listPlayableClubPoolPlayers({ clubId: "pors", players });
          check("Pors 63 dokumenterte", porsDocumented.length === 63, String(porsDocumented.length));
          check("Pors 16 spillbare", porsPlayable.length === 16, String(porsPlayable.length));
          check("Pors 47 historikkposter", porsDocumented.length - porsPlayable.length === 47);
          const porsFull = resolveClubSquadAccess({ club: pors, players, unlockedPlaceIds: [pors.homePlaceId], candidateIds, squadSize: REQUIRED });
          check("Pors åpner bare 16", porsFull.clubPoolIds.length === 16 && porsFull.heritage.length === 16);

          console.log(JSON.stringify({
            ok: true,
            sjekker: checks,
            spillere: players.length,
            klubbtilknytninger: affiliationCount,
            readyKlubber: ready.length,
            pendingKlubber: pending.length,
            porsDokumentert: porsDocumented.length,
            porsSpillbar: porsPlayable.length,
            porsArkiv: porsDocumented.length - porsPlayable.length
          }, null, 2));
          '''
          write("scripts/simulate-club-squad.mjs", textwrap.dedent(sim_source).lstrip())

          # --------------------------------------------------------------
          # Register permanent audit in package and CI.
          # --------------------------------------------------------------
          package = json.loads(read("package.json"))
          scripts = package.setdefault("scripts", {})
          if "audit:pors-heritage" not in scripts:
              ordered = {}
              for key, value in scripts.items():
                  ordered[key] = value
                  if key == "audit:clubs":
                      ordered["audit:pors-heritage"] = "node scripts/audit-pors-heritage.mjs"
              package["scripts"] = ordered
          write("package.json", json.dumps(package, ensure_ascii=False, indent=2) + "\n")

          replace_once(
              ".github/workflows/ci.yml",
              '''          npm run audit:clubs
            node scripts/sync-club-affiliations.mjs''',
              '''          npm run audit:clubs
            npm run audit:pors-heritage
            node scripts/sync-club-affiliations.mjs''',
              "Pors audit in CI"
          )

          # --------------------------------------------------------------
          # Canonical docs and repository verification.
          # --------------------------------------------------------------
          pool_doc = read("docs/CLUB_PLAYER_POOL_V1.md")
          pool_doc = pool_doc.replace(
              "- `ready`: minst 15 eksplisitt tilknyttede spillere.\n- `pending`: færre enn 15.",
              "- `ready`: minst 15 eksplisitt tilknyttede spillere med dokumentert posisjon.\n"
              "- `pending`: færre enn 15 slike spillbare profiler, uavhengig av hvor mange navn historikkatalogen inneholder."
          )
          if "## Dokumentert pool og spillbar pool" not in pool_doc:
              pool_doc = pool_doc.rstrip() + '''

          ## Dokumentert pool og spillbar pool

          `listClubPoolPlayers` er klubbens komplette, dokumenterte historikkatalog. Den kan inneholde source-thin personer som foreløpig mangler dokumentert posisjon.

          `listPlayableClubPoolPlayers` er den simuleringsklare delmengden. En profil må ha minst én dokumentert naturlig eller brukbar posisjon før den kan velges til tropp, oppstilling, trening eller kamp. Motoren modellerer aldri en posisjon for å få en klubb over 15-spillergrensen.

          `playerPoolSize` teller dokumenterte klubbtilknytninger. `playablePlayerPoolSize` og `playerPoolStatus` følger den spillbare delmengden. Runtime rapporterer derfor `documentedCount`, `poolSize` og `unprofiledCount` separat.
          '''
          write("docs/CLUB_PLAYER_POOL_V1.md", textwrap.dedent(pool_doc).lstrip())

          pors_doc = read("docs/P2_PORS_SOURCE_PASS.md")
          if "## Spillbarhetsgrense" not in pors_doc:
              pors_doc = pors_doc.rstrip() + '''

          ## Spillbarhetsgrense

          De 63 Pors-navnene er én dokumentert historikkatalog, men ikke én automatisk spillbar tropp.

          - **16** profiler har dokumentert posisjon og er spillbare.
          - **47** profiler uten dokumentert posisjon beholdes som historikkposter.
          - `pors_stadion` åpner bare de 16 spillbare profilene.
          - Stadionbesøket konstruerer aldri posisjoner, roller, styrker eller taktisk fit.
          - Senere kildebelegg kan flytte en eksisterende historikkpost inn i den spillbare poolen uten ny identitet.

          `audit:pors-heritage` låser 63/16/47-grensen, de fem krysskoblingene, P1-nevneren og stadion-unlocken.
          '''
          write("docs/P2_PORS_SOURCE_PASS.md", textwrap.dedent(pors_doc).lstrip())

          worklist = read("docs/arbeidsliste.md")
          worklist = worklist.replace(
              "## P2 — 18 klubber uten arv, alle i 2. divisjon",
              "## P2 — 17 klubber uten arv, alle i 2. divisjon"
          )
          worklist = worklist.replace(
              "**Avdeling 1 (10):** Pors · Brattvåg · Eik Tønsberg · Vidar · Kvik Halden · Sandviken · Lysekloster · Sotra · Træff · Bjarg",
              "**Avdeling 1 (9 gjenstår):** Brattvåg · Eik Tønsberg · Vidar · Kvik Halden · Sandviken · Lysekloster · Sotra · Træff · Bjarg"
          )
          marker = "## P2 — 17 klubber uten arv, alle i 2. divisjon\n"
          note = (
              "\n**Ferdig første leveranse:** Pors har 63 dokumenterte klubbprofiler, "
              "16 spillbare profiler og 47 historikkposter uten konstruert posisjon. "
              "`audit:pors-heritage` låser grensen.\n"
          )
          if note.strip() not in worklist:
              worklist = worklist.replace(marker, marker + note, 1)
          write("docs/arbeidsliste.md", worklist)

          verification_md = '''# Pors · endelig repo-verifisering

          ## Leveranser

          - PR #211 materialiserte 63 dokumenterte Pors-koblinger og ble squash-merget som `ef1bfd579f684ff6a0e2fc19b3fc8f8a97d3b64a`.
          - PR #212 rettet troppshydreringen og ble squash-merget som `e28988aff32f6d4720f80bb905542fed3170b4dc`; full CI passerte 146/146 nettlesertester.
          - Denne leveransen lukker reviewpunktet om posisjonsløse profiler ved å skille historikkatalogen fra den spillbare poolen.

          ## Låst kontrakt

          - 63 dokumenterte Pors-profiler.
          - 16 profiler med dokumentert posisjon og simuleringstilgang.
          - 47 historikkposter uten konstruert posisjon, rolle eller taktisk fit.
          - `pors_stadion` åpner 16 spillerkandidater, ikke 63.
          - Fem canonical krysskoblinger beholdes uten omskriving av eldre `sourcePlaceIds`.
          - P1-nevneren forblir 936/936.

          ## Permanente porter

          ```bash
          npm run audit:pors-heritage
          node scripts/sync-club-affiliations.mjs
          npm run sim:club-squad
          npm run audit:attributes
          npm run sim:player-attributes
          npm run sim:player-weaknesses
          node scripts/audit-p1-source-claims.mjs
          npm run test:browser
          ```
          '''
          write("docs/pors-postmerge-verification.md", textwrap.dedent(verification_md).lstrip())

          verification = {
              "schema": "historygo-football-manager.pors-final-verification.v2",
              "generatedOn": "2026-08-14",
              "sourceDelivery": {
                  "pullRequest": 211,
                  "mergeCommit": "ef1bfd579f684ff6a0e2fc19b3fc8f8a97d3b64a"
              },
              "browserStabilization": {
                  "pullRequest": 212,
                  "mergeCommit": "e28988aff32f6d4720f80bb905542fed3170b4dc",
                  "ciRun": 31727529407,
                  "status": "success",
                  "browserPassed": 146,
                  "browserFailed": 0
              },
              "canonicalPopulation": {
                  "documented": 63,
                  "playable": 16,
                  "heritageOnly": 47,
                  "exclusive": 58,
                  "crossLinked": 5,
                  "stadiumUnlocks": 16
              },
              "playabilityBoundary": {
                  "branch": "agent/pors-playable-boundary-v2",
                  "pullRequest": None,
                  "mergeCommit": None,
                  "ci": "pending"
              },
              "checks": [
                  "npm run audit:pors-heritage",
                  "node scripts/sync-club-affiliations.mjs",
                  "npm run sim:club-squad",
                  "npm run audit:attributes",
                  "npm run sim:player-attributes",
                  "npm run sim:player-weaknesses",
                  "node scripts/audit-p1-source-claims.mjs",
                  "npm run test:browser"
              ]
          }
          write("docs/pors-final-verification.json", json.dumps(verification, ensure_ascii=False, indent=2) + "\n")

          # One-shot workflow must not survive in the permanent tree.
          Path(".github/workflows/apply-pors-playable-boundary-v2.yml").unlink()

      - name: Install dependencies
        run: npm ci

      - name: Materialize derived club status
        run: node scripts/sync-club-affiliations.mjs --write

      - name: Validate permanent boundary
        run: |
          node --check src/football-club-squad.js
          node --check scripts/sync-club-affiliations.mjs
          node --check scripts/simulate-club-squad.mjs
          node --check scripts/audit-pors-heritage.mjs
          node scripts/sync-club-affiliations.mjs
          npm run audit:pors-heritage
          npm run sim:club-squad
          npm run audit:clubs
          npm run audit:attributes
          npm run sim:player-attributes
          npm run sim:player-weaknesses
          node scripts/audit-p1-source-claims.mjs
          npm run audit:ci-coverage

      - name: Commit permanent files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Skill Pors-historikk fra spillbar spillerpool"
          git push origin HEAD:agent/pors-playable-boundary-v2
