name: Molde Eidur provenance sync (one-time)
on:
  push:
    branches:
      - feat/molde-eidur-source-20261021
permissions:
  contents: write
jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Upgrade exactly one official Molde affiliation
        run: node scripts/sync-molde-eidur-affiliation.mjs --write
      - name: Commit canonical source change
        run: |
          if ! git diff --quiet -- data/football_players.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/football_players.json
            git commit -m "Molde: substantiate Eidur Gudjohnsen official club affiliation"
            git push
          else
            echo "Canonical affiliation already synchronized"
          fi
