name: Notodden import

on:
  push:
    branches:
      - agent/notodden-heritage-v2

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]' || contains(github.event.head_commit.message, 'tmp:')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/notodden-heritage-v2
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Correct verified full name
        run: sed -i 's/"Thomas Lillo"/"Thomas Rømo Lillo"/' scripts/import-notodden-player-pool.mjs

      - name: Import Notodden
        run: |
          node scripts/import-notodden-player-pool.mjs
          node scripts/sync-club-affiliations.mjs --write
          node scripts/import-notodden-player-pool.mjs --docs

      - name: Audit canonical data
        run: |
          node scripts/sync-club-affiliations.mjs
          npm run audit:attributes
          npm run sim:player-attributes
          npm run audit:clubs
          npm run sim:club-selection
          npm run sim:club-squad

      - name: Remove one-shot import machinery
        run: |
          rm scripts/import-notodden-player-pool.mjs
          rm .github/workflows/notodden-import.yml

      - name: Commit generated Notodden pool
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Notodden-arv: 85 kildebelagte profiler etter v2-standarden"
          git push origin HEAD:agent/notodden-heritage-v2
