name: Recruitment v1 starter floor

on:
  push:
    branches:
      - agent/recruitment-v1
    paths:
      - .github/workflows/recruitment-v1-starter-floor.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/recruitment-v1
      - name: Preserve existing starter squad across recruitment surfaces
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, got {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          app = 'src/app.js'
          replace_once(
              app,
              '''  const recruitmentState = normalizeRecruitmentState(state.teamMerits);\n  recruitmentState.recruitedPlayerIds.forEach((playerId) => {\n    if (candidatePlayerIds.has(playerId)) {\n      unlockedPlayerIds.add(playerId);\n    }\n  });\n\n  // Lokal start utvider bare spillerpoolen. Den åpner ingen steder og skriver\n  // aldri til History Go-progresjonen (visited_places/groundhopper-state).\n  getLocalStartPlayerIds().forEach((playerId) => {\n    unlockedPlayerIds.add(playerId);\n    const sources = playerSourceById.get(playerId) || { placeIds: new Set(), localStart: false };\n    sources.localStart = true;\n    playerSourceById.set(playerId, sources);\n  });''',
              '''  const recruitmentState = normalizeRecruitmentState(state.teamMerits);\n  recruitmentState.recruitedPlayerIds.forEach((playerId) => {\n    if (candidatePlayerIds.has(playerId)) {\n      unlockedPlayerIds.add(playerId);\n    }\n  });\n\n  // Starttroppen er det eksisterende spillbarhetsgulvet og er ikke en History Go-\n  // signering. Når ingen eksplisitt lokal/starttropp er lagret, brukes den samme\n  // deterministiske 15-spillerstroppen som før Rekruttering v1. Kandidater utover\n  // dette gulvet må fortsatt hentes eksplisitt.\n  const localStartPlayerIds = getLocalStartPlayerIds();\n  if (!localStartPlayerIds.length && !isNationalModeActive()) {\n    getStarterSquadPlayerIds(REQUIRED_SQUAD_SIZE).forEach((playerId) => {\n      unlockedPlayerIds.add(playerId);\n      const sources = playerSourceById.get(playerId) || { placeIds: new Set(), localStart: false };\n      sources.localStart = true;\n      playerSourceById.set(playerId, sources);\n    });\n  }\n\n  // Lokal start utvider bare spillerpoolen. Den åpner ingen steder og skriver\n  // aldri til History Go-progresjonen (visited_places/groundhopper-state).\n  localStartPlayerIds.forEach((playerId) => {\n    unlockedPlayerIds.add(playerId);\n    const sources = playerSourceById.get(playerId) || { placeIds: new Set(), localStart: false };\n    sources.localStart = true;\n    playerSourceById.set(playerId, sources);\n  });'''
          )

          player = 'src/ui/manager-player-workspace-v1.js'
          replace_once(
              player,
              'import { normalizeRecruitmentState } from "../football-recruitment.js";',
              'import { buildStarterSquadPlayerIds, normalizeRecruitmentState } from "../football-recruitment.js";'
          )
          replace_once(
              player,
              '''function resolveUnlockedPlayerIds(players, unlockData) {\n  const merits = readStorage(STORAGE.merits, {});\n  const recruitment = normalizeRecruitmentState(merits);\n  const placeIds = historyGoPlaceIds();\n  asArray(merits?.unlockedPlaceIds).forEach((id) => placeIds.add(String(id)));\n  const candidateIds = new Set();\n  asArray(unlockData?.placeUnlocks).forEach((place) => {\n    if (!placeIds.has(String(place?.placeId))) return;\n    asArray(place?.unlocks).forEach((unlock) => {\n      if (unlock?.type === "player_candidate" && unlock?.targetId) candidateIds.add(String(unlock.targetId));\n    });\n  });\n  const current = new Set(asArray(merits?.localStart?.playerIds).map(String));\n  recruitment.recruitedPlayerIds.forEach((id) => { if (candidateIds.has(String(id))) current.add(String(id)); });\n  // Bare gamle, ikke-migrerte states får den tidligere fallbacken. I v1 betyr\n  // kandidattilgang ikke lenger automatisk troppsmedlemskap.\n  if (recruitment.recruitmentVersion !== 1 && !current.size && !sessionPlayerPool.size) {\n    buildStarterSquad(players, candidateIds).forEach((id) => current.add(id));\n  }\n  current.forEach((id) => sessionPlayerPool.add(id));\n  return new Set(sessionPlayerPool);\n}''',
              '''function resolveUnlockedPlayerIds(players, unlockData) {\n  const merits = readStorage(STORAGE.merits, {});\n  const recruitment = normalizeRecruitmentState(merits);\n  const placeIds = historyGoPlaceIds();\n  asArray(merits?.unlockedPlaceIds).forEach((id) => placeIds.add(String(id)));\n  const starterCandidateIds = new Set();\n  const eligibleCandidateIds = new Set();\n  asArray(unlockData?.placeUnlocks).forEach((place) => {\n    const nationalArena = text(place?.placeRole).includes("national");\n    asArray(place?.unlocks).forEach((unlock) => {\n      if (unlock?.type !== "player_candidate" || !unlock?.targetId || nationalArena) return;\n      const id = String(unlock.targetId);\n      starterCandidateIds.add(id);\n      if (placeIds.has(String(place?.placeId))) eligibleCandidateIds.add(id);\n    });\n  });\n  const localIds = asArray(merits?.localStart?.playerIds).map(String);\n  const starterIds = localIds.length ? [] : buildStarterSquadPlayerIds(players, [...starterCandidateIds], 15);\n  const current = new Set([...starterIds, ...localIds]);\n  recruitment.recruitedPlayerIds.forEach((id) => {\n    if (eligibleCandidateIds.has(String(id))) current.add(String(id));\n  });\n  current.forEach((id) => sessionPlayerPool.add(id));\n  return new Set(sessionPlayerPool);\n}'''
          )

          scouting = 'src/ui/manager-scouting-workspace-v1.js'
          replace_once(
              scouting,
              'import { recruitPlayerToMerits, normalizeRecruitmentState } from "../football-recruitment.js";',
              'import { buildStarterSquadPlayerIds, recruitPlayerToMerits, normalizeRecruitmentState } from "../football-recruitment.js";'
          )
          replace_once(
              scouting,
              '''  const localIds = new Set(asArray(merits?.localStart?.playerIds).map(String));\n  const recruitment = normalizeRecruitmentState(merits);\n  const squadIds = new Set([...localIds, ...recruitment.recruitedPlayerIds]);\n  const quizCompleted = quizCompletedPlaceIds instanceof Set\n    ? quizCompletedPlaceIds\n    : quizCompletedPlaceIds === null\n      ? null\n      : new Set(asArray(quizCompletedPlaceIds).map(String));\n  const sources = new Map();\n\n  asArray(unlockData?.placeUnlocks).forEach((place) => {\n    const placeId = String(place?.placeId || "");\n    if (!placeId || !unlockedPlaces.has(placeId) || isNationalArenaPlace(place)) return;\n    const needsQuiz = quizCompleted !== null && historyPlaces.has(placeId) && !quizCompleted.has(placeId);\n    if (needsQuiz) return;\n    asArray(place?.unlocks).forEach((unlock) => {\n      if (unlock?.type !== "player_candidate" || !unlock?.targetId) return;\n      const id = String(unlock.targetId);\n      if (!sources.has(id)) sources.set(id, []);\n      sources.get(id).push({ placeId, placeName: text(place.placeName, formatToken(placeId)) });\n    });\n  });\n\n  return asArray(players)\n    .filter((player) => localIds.has(String(player.id)) || sources.has(String(player.id)))''',
              '''  const localIds = new Set(asArray(merits?.localStart?.playerIds).map(String));\n  const recruitment = normalizeRecruitmentState(merits);\n  const quizCompleted = quizCompletedPlaceIds instanceof Set\n    ? quizCompletedPlaceIds\n    : quizCompletedPlaceIds === null\n      ? null\n      : new Set(asArray(quizCompletedPlaceIds).map(String));\n  const sources = new Map();\n  const starterCandidateIds = new Set();\n\n  asArray(unlockData?.placeUnlocks).forEach((place) => {\n    const placeId = String(place?.placeId || "");\n    if (!placeId || isNationalArenaPlace(place)) return;\n    const playerUnlocks = asArray(place?.unlocks).filter((unlock) => unlock?.type === "player_candidate" && unlock?.targetId);\n    playerUnlocks.forEach((unlock) => starterCandidateIds.add(String(unlock.targetId)));\n    if (!unlockedPlaces.has(placeId)) return;\n    const needsQuiz = quizCompleted !== null && historyPlaces.has(placeId) && !quizCompleted.has(placeId);\n    if (needsQuiz) return;\n    playerUnlocks.forEach((unlock) => {\n      const id = String(unlock.targetId);\n      if (!sources.has(id)) sources.set(id, []);\n      sources.get(id).push({ placeId, placeName: text(place.placeName, formatToken(placeId)) });\n    });\n  });\n\n  const starterIds = new Set(localIds.size ? [] : buildStarterSquadPlayerIds(players, [...starterCandidateIds], 15));\n  const squadIds = new Set([...starterIds, ...localIds, ...recruitment.recruitedPlayerIds]);\n\n  return asArray(players)\n    .filter((player) => starterIds.has(String(player.id)) || localIds.has(String(player.id)) || sources.has(String(player.id)))'''
          )
          replace_once(
              scouting,
              '''      isLocalStart: localIds.has(String(player.id)),\n      isInSquad: squadIds.has(String(player.id)),''',
              '''      isStarter: starterIds.has(String(player.id)),\n      isLocalStart: localIds.has(String(player.id)),\n      isInSquad: squadIds.has(String(player.id)),'''
          )
          PY
      - name: Commit starter floor
        run: |
          rm .github/workflows/recruitment-v1-starter-floor.yml
          git config user.name "Paradispartiet"
          git config user.email "paradispartiet@gmail.com"
          git add src/app.js src/ui/manager-player-workspace-v1.js src/ui/manager-scouting-workspace-v1.js .github/workflows/recruitment-v1-starter-floor.yml
          git commit -m "Keep starter squad as recruitment floor"
          git push origin HEAD:agent/recruitment-v1
