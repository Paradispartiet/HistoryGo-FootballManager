name: Full-season recovery diagnostic

on:
  push:
    branches:
      - agent/training-recovery-order-20260918

permissions:
  contents: read

jobs:
  full-season:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run canonical full-season diagnostic only
        run: npx playwright test tests/browser/manager-career-full-season-playthrough-v1.spec.js --project=chromium-full-season --no-deps --workers=1 --retries=0 --reporter=list
