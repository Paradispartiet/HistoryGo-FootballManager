name: Facilities persistence fix

on:
  push:
    branches:
      - agent/facilities-upgrades-v1

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply facilities persistence fix'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/facilities-upgrades-v1
          fetch-depth: 0

      - name: Sync team merits into league mode snapshot
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/app.js')
          text = path.read_text()
          old = '''function saveTeamMerits() {
            if (state.modeEnvelope && !isLeagueModeActive()) return;
            if (!state.teamMerits) {
              return;
            }
            try {
              localStorage.setItem(TEAM_MERITS_KEY, JSON.stringify(state.teamMerits));
            } catch (error) {
              // Lagring kan feile i privat modus e.l. Da kjører vi bare uten persistens.
            }
          }'''
          new = '''function saveTeamMerits() {
            if (state.modeEnvelope && !isLeagueModeActive()) return;
            if (!state.teamMerits) {
              return;
            }
            try {
              localStorage.setItem(TEAM_MERITS_KEY, JSON.stringify(state.teamMerits));
            } catch (error) {
              // Lagring kan feile i privat modus e.l. Da kjører vi bare uten persistens.
            }

            // Mode Isolation eier også et snapshot av league-staten. Hold samme
            // canonical teamMerits synkronisert der med én gang; ellers kan et
            // eldre snapshot vinne over hgfm.teamMerits.v1 ved neste reload.
            if (state.modeEnvelope && isLeagueModeActive()) {
              state.modeEnvelope.sessions.league = {
                ...state.modeEnvelope.sessions.league,
                teamMerits: cloneTeamMerits(state.teamMerits)
              };
              try {
                state.modeEnvelope = persistModeEnvelope(localStorage, state.modeEnvelope);
              } catch (_) {
                // Privat modus: legacy teamMerits-lagringen over er fortsatt best effort.
              }
            }
          }'''
          if old not in text:
              raise SystemExit('Expected saveTeamMerits block not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Install dependencies
        run: npm ci

      - name: Verify permanent fix
        run: |
          npm run check:syntax
          npm run audit:manager-facilities-upgrades-v1
          npm run sim:manager-facilities-upgrades-v1
          npm run audit:flow
          npm run audit:dead-ends

      - name: Commit permanent fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.js
          git commit -m "Sync facility merits with league session"
          git push origin HEAD:agent/facilities-upgrades-v1
