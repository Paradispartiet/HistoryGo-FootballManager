name: Temporary Molde final production audit
on:
  push:
    branches: [content/molde-strength-batch-20261017-b]
    paths: [.github/workflows/molde-unsourced-inventory-temporary.yml]
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check sourced Molde attributes and measure exact exclusive coverage
        run: |
          node scripts/audit-source-depth-claims.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {applyP1SourceClaims} from './src/football-player-source-claims-p1.js';
          import {applyP2SourceClaims} from './src/football-player-source-claims-p2.js';
          import {applySourceDepthClaims} from './src/football-player-source-claims-depth.js';
          const ids='bjorn_bergmann_sigur_arson arthur_albiston mame_biram_diouf orjan_nyland joona_toivio stian_gregersen etzaz_hussain ohi_omoijuanfo andreas_lund tor_fuglset jan_berg thomas_mork odd_inge_olsen clayton_zane jo_tessem marel_baldvinsson magne_simonsen trond_strande per_egil_flo stein_olav_hestad daniel_chima_chukwu ulrich_moller ole_bjorn_sundgot knut_anders_fostervold oystein_neerland eddie_gustafsson einar_sekkeseter'.split(' ');
          const raw=JSON.parse(fs.readFileSync('data/football_players.json','utf8')).players;
          const players=applySourceDepthClaims(applyP2SourceClaims(applyP1SourceClaims(raw)));
          for(const id of ids){
            const p=players.find(x=>x.id===id);
            assert.ok(p,'missing player '+id);
            assert.ok(p.clubAffiliations?.some(a=>a.clubId==='molde'&&a.source==='belagt'),id+' no Molde source');
            assert.ok(p.strengths?.length>0,id+' no strengths');
            console.log('PROFILE '+JSON.stringify({id,strengths:p.strengths,places:p.sourcePlaceIds}));
          }
          const pool=players.filter(p=>p.clubAffiliations?.some(a=>a.clubId==='molde'));
          const ex=players.filter(p=>p.sourcePlaceIds?.length===1&&p.sourcePlaceIds[0]==='aker_stadion');
          const missing=ex.filter(p=>!p.strengths?.length).length;
          const cap=(Math.ceil(100*missing/ex.length)+1)/100;
          console.log('RESULT '+JSON.stringify({verified:ids.length,poolTotal:pool.length,poolMissing:pool.filter(p=>!p.strengths?.length).length,exclusiveTotal:ex.length,exclusiveMissing:missing,cap}));
          NODE