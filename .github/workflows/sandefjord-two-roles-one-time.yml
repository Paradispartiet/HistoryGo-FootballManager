name: Sandefjord raw role sync (one-time)
on:
  push:
    branches:
      - fix/molde-hagbo-cb-20261021
permissions:
  contents: write
jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Synchronize two documented Sandefjord positions
        run: node scripts/sync-sandefjord-two-roles.mjs --write
      - name: Commit only canonical player-file changes
        run: |
          if ! git diff --quiet -- data/football_players.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/football_players.json
            git commit -m "Sandefjord: correct Johansen and Eftedal positions"
            git push
          else
            echo "No canonical player changes needed"
          fi
