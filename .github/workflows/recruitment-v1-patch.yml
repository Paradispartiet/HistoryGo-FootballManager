name: Recruitment v1 core patch

on:
  push:
    branches:
      - agent/recruitment-v1
    paths:
      - .github/workflows/recruitment-v1-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/recruitment-v1
      - name: Patch existing runtime files
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, got {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          app = "src/app.js"
          replace_once(
              app,
              'import { FOOTBALL_POSITIONS } from "./football-fit-engine.js";\n',
              'import { FOOTBALL_POSITIONS } from "./football-fit-engine.js";\nimport { migrateLegacyRecruitmentState, normalizeRecruitmentState } from "./football-recruitment.js";\n'
          )
          replace_once(
              app,
              '    nearbyFavorites: normalizeNearbyFavorites(base.nearbyFavorites),\n    hiredStaffIds:',
              '    nearbyFavorites: normalizeNearbyFavorites(base.nearbyFavorites),\n    ...normalizeRecruitmentState(base),\n    hiredStaffIds:'
          )
          replace_once(
              app,
              '  const unlockedPlayerIds = new Set();\n  const playerSourceById = new Map();',
              '  const candidatePlayerIds = new Set();\n  const unlockedPlayerIds = new Set();\n  const playerSourceById = new Map();'
          )
          replace_once(
              app,
              '        unlockedPlayerIds.add(unlock.targetId);\n        const sources = playerSourceById.get(unlock.targetId) || { placeIds: new Set(), localStart: false };',
              '        candidatePlayerIds.add(unlock.targetId);\n        const sources = playerSourceById.get(unlock.targetId) || { placeIds: new Set(), localStart: false };'
          )
          replace_once(
              app,
              '  unlockedPlayerIds.forEach((playerId) => {\n    nationalOnlyPlayerIds.delete(playerId);\n    quizPendingPlayerIds.delete(playerId);\n  });\n\n  // Lokal start utvider bare spillerpoolen.',
              '''  candidatePlayerIds.forEach((playerId) => {\n    nationalOnlyPlayerIds.delete(playerId);\n    quizPendingPlayerIds.delete(playerId);\n  });\n\n  // Recruitment v1: History Go gir kandidattilgang; troppen består av\n  // starttroppen + eksplisitt rekrutterte kandidater. Gamle saves migreres én\n  // gang ved å bevare kandidatene som tidligere automatisk var spillbare.\n  if (state.teamMerits) {\n    const migration = migrateLegacyRecruitmentState(state.teamMerits, [...candidatePlayerIds]);\n    if (migration.migrated) {\n      state.teamMerits.recruitmentVersion = migration.merits.recruitmentVersion;\n      state.teamMerits.recruitedPlayerIds = migration.merits.recruitedPlayerIds;\n      saveTeamMerits();\n    }\n  }\n  const recruitmentState = normalizeRecruitmentState(state.teamMerits);\n  recruitmentState.recruitedPlayerIds.forEach((playerId) => {\n    if (candidatePlayerIds.has(playerId)) {\n      unlockedPlayerIds.add(playerId);\n    }\n  });\n\n  // Lokal start utvider bare spillerpoolen.'''
          )
          replace_once(
              app,
              '    placeUnlocks,\n    unlockedPlayers,',
              '    placeUnlocks,\n    candidatePlayerIds,\n    unlockedPlayers,'
          )
          replace_once(
              app,
              '// Opplåste spillere: ekte spillere fra state.players som er pekt på av et\n// player_candidate-unlock på et opplåst sted.\nfunction getUnlockedPlayers()',
              '// Troppsspillere: starttroppen + eksplisitt rekrutterte kandidater som fortsatt\n// har en gyldig klubb-/quiz-kilde. Kandidattilgang alene gjør ikke spilleren spillbar.\nfunction getUnlockedPlayers()'
          )
          replace_once(
              app,
              '''  window.addEventListener("updateProfile", () => {\n    refreshAvailabilityFromHistoryGo();\n  });\n\n  // Cross-tab/vindu:''',
              '''  window.addEventListener("updateProfile", () => {\n    refreshAvailabilityFromHistoryGo();\n  });\n\n  // Same-window recruitment: Speiding skriver den samme teamMerits-nøkkelen og\n  // ber kjernen lese den på nytt. Ingen parallell troppsstate eller sidecache.\n  window.addEventListener("hgfm:team-merits-changed", () => {\n    state.teamMerits = loadTeamMerits(teamMeritsSeed);\n    invalidateAvailability();\n    sanitizeLineupForUnlockedPlayers();\n    sanitizeSelectedFormation();\n    renderApp();\n  });\n\n  // Cross-tab/vindu:'''
          )

          scouting = "src/ui/manager-scouting-workspace-v1.js"
          replace_once(
              scouting,
              'function formatToken(value) { return text(value, "–").replace(/_/g, " ").replace(/\\b\\w/g, (letter) => letter.toUpperCase(); }',
              'function formatToken(value) { return text(value, "–").replace(/_/g, " ").replace(/\\b\\w/g, (letter) => letter.toUpperCase()); }'
          )
          PY
      - name: Commit patched runtime
        run: |
          rm .github/workflows/recruitment-v1-patch.yml
          git config user.name "Paradispartiet"
          git config user.email "paradispartiet@gmail.com"
          git add src/app.js src/ui/manager-scouting-workspace-v1.js .github/workflows/recruitment-v1-patch.yml
          git commit -m "Integrate recruitment state with squad availability"
          git push origin HEAD:agent/recruitment-v1
