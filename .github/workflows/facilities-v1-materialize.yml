name: Facilities v1 materializer

on:
  push:
    branches:
      - agent/facilities-upgrades-v1

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.head_commit.message == 'Push facilities v1 product without workflow'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/facilities-upgrades-v1
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Materialize permanent feature files
        run: |
          python3 scripts/_materialize_facilities_v1.py
          python3 scripts/_fix_facilities_stale_ids.py

      - name: Install dependencies
        run: npm ci

      - name: Targeted facility gates
        run: |
          npm run check:syntax
          npm run audit:manager-facilities-upgrades-v1
          npm run sim:manager-facilities-upgrades-v1
          npm run audit:manager-club-scene-v1
          npm run sim:manager-club-scene-v1
          npm run audit:manager-club-operations-v1
          npm run sim:manager-club-operations-v1
          npm run audit:flow
          npm run audit:dead-ends

      - name: Commit permanent feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src data index.html docs package.json scripts/*.mjs tests/browser/manager-facilities-upgrades-v1.spec.js
          git commit -m "Implement real facilities upgrades v1"
          git push origin HEAD:agent/facilities-upgrades-v1
