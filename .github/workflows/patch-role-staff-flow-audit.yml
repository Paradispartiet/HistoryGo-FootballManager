name: Patch role-based staff flow audit

on:
  push:
    branches:
      - agent/staff-roster-v1-clean
    paths:
      - .github/workflows/patch-role-staff-flow-audit.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/staff-roster-v1-clean
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Update permanent flow guards
        run: python .github/patch-role-staff-flow-audit.py
      - name: Verify flow guards
        run: |
          npm ci
          npm run audit:flow
          npm run audit:dead-ends
          npm run audit:manager-staff-roster-v1
          npm run sim:manager-staff-roster-v1
      - name: Commit permanent audit update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/patch-role-staff-flow-audit.py
          git rm .github/workflows/patch-role-staff-flow-audit.yml
          git add scripts/audit-flow.mjs
          git diff --cached --check
          git commit -m "Align flow guards with role-based staff roster"
          git push origin HEAD:agent/staff-roster-v1-clean
