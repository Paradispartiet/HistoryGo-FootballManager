name: Molde Hagbo raw role sync (one-time)
on:
  push:
    branches:
      - fix/molde-hagbo-cb-20261021
permissions:
  contents: write
jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update the one sourced Molde player's role
        run: node scripts/sync-molde-hagbo-role.mjs --write
      - name: Commit exactly the changed canonical catalog
        run: |
          if ! git diff --quiet -- data/football_players.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/football_players.json
            git commit -m "Molde: correct Hagbo's canonical goalkeeper error to documented stopper"
            git push
          else
            echo "Canonical catalog already synchronized"
          fi
