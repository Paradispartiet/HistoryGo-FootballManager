name: Diagnose Season Command

on:
  push:
    branches:
      - agent/manager-season-command-v1
    paths:
      - .github/workflows/diagnose-season-command.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/manager-season-command-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update legacy season-flow assertion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/simulate-manager-flow-ui.mjs')
          text = path.read_text(encoding='utf-8')
          old = 'check("aktiv save viser ligastatus/terminliste", htmlSource.includes("Terminliste og tabell") && appSource.includes("getNextLeagueOpponent(state.leagueSeason)"));'
          new = '''check(
            "aktiv save viser sesongkontroll og ligadata",
            htmlSource.includes('id="seasonCommand"')
              && appSource.includes("createSeasonSceneModel({")
              && appSource.includes("renderSeasonCommand(elements.seasonCommand, scene")
              && appSource.includes("renderSeasonLeagueOverview(overview, scene, season)")
          );'''
          if old not in text:
              raise SystemExit('Legacy season-flow assertion not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Manager flow UI
        run: node scripts/simulate-manager-flow-ui.mjs
      - name: Manager ground flow
        run: node scripts/simulate-manager-ground-flow-v1.mjs
      - name: Manager season scene
        run: node scripts/simulate-manager-season-scene-v1.mjs
      - name: Publish permanent assertion update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/simulate-manager-flow-ui.mjs
          git commit -m "Oppdater managerflyt for sesongkontroll"
          git push origin HEAD:agent/manager-season-command-v1
