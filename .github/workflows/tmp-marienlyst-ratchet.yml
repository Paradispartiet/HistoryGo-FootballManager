name: Temporary Marienlyst ratchet update
on:
  push:
    branches:
      - content/stromsgodset-source-final-20261018c
    paths:
      - .github/workflows/tmp-marienlyst-ratchet.yml
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Align ratchet with measured 30 of 84
        run: node scripts/tmp-marienlyst-ratchet.mjs
      - name: Remove temporary files and commit permanent adjustment
        run: |
          rm -f .github/workflows/tmp-marienlyst-ratchet.yml scripts/tmp-marienlyst-ratchet.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/simulate-player-attributes.mjs .github/workflows/tmp-marienlyst-ratchet.yml scripts/tmp-marienlyst-ratchet.mjs
          git commit -m "data(stromsgodset): align coverage guard to measured 30 of 84"
          git push origin HEAD:content/stromsgodset-source-final-20261018c
