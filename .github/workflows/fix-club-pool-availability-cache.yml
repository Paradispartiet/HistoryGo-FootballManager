name: Fix club pool availability cache

on:
  push:
    branches:
      - agent/club-pool-save-integrity-v1
    paths:
      - .github/workflows/fix-club-pool-availability-cache.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Kjør engangsfix for klubbpool availability-cache'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/club-pool-save-integrity-v1
          fetch-depth: 0

      - name: Patch availability cache boundary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/app.js')
          text = path.read_text()
          old = '''  state.gameStartState = normalizeGameStartState({ ...state.gameStartState, selectedMode: mode });
            persistModeEnvelope(localStorage, state.modeEnvelope);
            saveGameStartState();
          }'''
          new = '''  state.gameStartState = normalizeGameStartState({ ...state.gameStartState, selectedMode: mode });
            // Availability er klubb- og modusavhengig. hydratePersistedUiState() kan ha
            // fylt cachen før gameStartState og aktiv modussnapshot var ferdig hydrert;
            // nullstill den her før startelleveren seedes mot feil spillerpool.
            invalidateAvailability();
            persistModeEnvelope(localStorage, state.modeEnvelope);
            saveGameStartState();
          }'''
          if old not in text:
              raise SystemExit('Fant ikke forventet hydrateModeSessions-blokk i src/app.js')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Restore browser test after diagnostics
        shell: bash
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- tests/browser/manager-matchday-scene-v1.spec.js

      - name: Verify patch shape
        shell: bash
        run: |
          node --check src/app.js
          grep -A8 -B2 'state.gameStartState = normalizeGameStartState' src/app.js | grep 'invalidateAvailability();'
          ! grep -q 'readDiagnosticState' tests/browser/manager-matchday-scene-v1.spec.js

      - name: Remove one-shot workflow and push final fix
        shell: bash
        run: |
          rm .github/workflows/fix-club-pool-availability-cache.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app.js tests/browser/manager-matchday-scene-v1.spec.js .github/workflows/fix-club-pool-availability-cache.yml
          git commit -m 'Rett klubbavhengig availability-cache ved oppstart'
          git push origin HEAD:agent/club-pool-save-integrity-v1
