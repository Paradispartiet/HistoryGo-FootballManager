name: Temporary materialize training scene v2

on:
  push:
    branches:
      - agent/manager-training-scene-v2
    paths:
      - .github/workflows/temp-materialize-training-scene-v2.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/manager-training-scene-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch training scene into existing surfaces
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def replace_once(path, old, new):
              source = Path(path).read_text()
              if old not in source:
                  raise SystemExit(f"Anchor not found in {path}: {old[:100]!r}")
              Path(path).write_text(source.replace(old, new, 1))

          # index.html: one command scene, one folded depth level, existing workspace intact.
          index = Path("index.html").read_text()
          command_anchor = '      <!-- UKENS PLAN: fire steg i fast rekkefølge, ikke tre parallelle lister.'
          command_markup = '''      <section class="manager-surface training-command-panel" id="trainingCommandPanel" aria-label="Treningskommando" aria-live="polite">
        <div id="trainingCommand" class="training-command"></div>
      </section>

      <details class="training-depth" id="trainingDepth">
        <summary>Planstatus og troppsdetaljer</summary>
        <div class="training-depth-content">

'''
          if 'id="trainingCommandPanel"' not in index:
              if command_anchor not in index:
                  raise SystemExit("Training command anchor missing")
              index = index.replace(command_anchor, command_markup + command_anchor, 1)
          close_anchor = '''      </section>

      <!-- Kjernevalgene ligger i én sammenhengende arbeidsflate. Det gjør'''
          close_markup = '''      </section>
        </div>
      </details>

      <!-- Kjernevalgene ligger i én sammenhengende arbeidsflate. Det gjør'''
          if 'id="trainingDepth"' in index and '</details>\n\n      <!-- Kjernevalgene' not in index:
              if close_anchor not in index:
                  raise SystemExit("Training depth close anchor missing")
              index = index.replace(close_anchor, close_markup, 1)
          Path("index.html").write_text(index)

          # app.js: import, DOM bindings and presentation bridge.
          replace_once(
              "src/app.js",
              'import { createOfficeSceneModel, renderOfficeCommand } from "./ui/manager-office-presentation.js";\n',
              'import { createOfficeSceneModel, renderOfficeCommand } from "./ui/manager-office-presentation.js";\nimport { createManagerTrainingSceneModel, renderManagerTrainingCommand } from "./ui/manager-training-presentation.js";\n'
          )
          replace_once(
              "src/app.js",
              '  trainingPlanHeadline: document.querySelector("#trainingPlanHeadline"),\n',
              '  trainingCommand: document.querySelector("#trainingCommand"),\n  trainingDepth: document.querySelector("#trainingDepth"),\n  trainingPlanHeadline: document.querySelector("#trainingPlanHeadline"),\n'
          )
          helper = '''function openManagerTrainingTarget(target) {
  if (target === "inbox" || target === "kamp") {
    activateTab(target);
    return;
  }
  if (target === "details") {
    if (elements.trainingDepth) {
      elements.trainingDepth.open = true;
      elements.trainingDepth.scrollIntoView({ behavior: "smooth", block: "start" });
    }
    return;
  }
  const step = typeof target === "string" ? document.getElementById(target) : null;
  if (!step) return;
  state.openTrainingStepId = step.id;
  activateTab("trening");
  requestAnimationFrame(() => {
    syncTrainingWorkspace(document.querySelector("#trainingWorkspace"), state.openTrainingStepId);
    step.scrollIntoView({ behavior: "smooth", block: "start" });
    step.focus({ preventScroll: true });
  });
}

function renderManagerTrainingScene(plan) {
  if (!elements.trainingCommand) return;
  const conditionSummary = summarizeSquadCondition(getPlayerCondition());
  const individualSummary = summarizeIndividualTraining({
    catalogue: state.individualTrainingCatalogue,
    assignments: getIndividualAssignments(),
    capacity: getIndividualTrainingCapacity()
  });
  const offPitchSummary = summarizeOffPitchContext(getOffPitchState());
  const selectedProgram = getSelectedTrainingProgramComposition();
  const selectedFocus = getTrainingFocus(state.weeklyTrainingFocus?.focusId || null);
  const model = createManagerTrainingSceneModel({
    week: Number(state.clubWeekState?.week) || 1,
    phase: state.clubWeekState?.phase || "training",
    opponent: getMiniSeasonNextOpponent(),
    plan,
    assistantSignal: elements.trainingChoiceSignal?.textContent || offPitchSummary.headline,
    assistantDetail: plan?.coherence?.note || offPitchSummary.headline,
    conditionSummary,
    selectedProgram,
    selectedFocus,
    individualSummary
  });
  renderManagerTrainingCommand(elements.trainingCommand, model, { onOpenTarget: openManagerTrainingTarget });
}

'''
          app = Path("src/app.js").read_text()
          if "function openManagerTrainingTarget(" not in app:
              anchor = "function renderWeeklyTrainingPlan() {"
              if anchor not in app:
                  raise SystemExit("renderWeeklyTrainingPlan anchor missing")
              app = app.replace(anchor, helper + anchor, 1)
          render_anchor = '''  state.openTrainingStepId = syncTrainingWorkspace(
    document.querySelector("#trainingWorkspace"),
    state.openTrainingStepId
  );
}'''
          render_replacement = '''  renderManagerTrainingScene(plan);

  state.openTrainingStepId = syncTrainingWorkspace(
    document.querySelector("#trainingWorkspace"),
    state.openTrainingStepId
  );
}'''
          if "renderManagerTrainingScene(plan);" not in app:
              if render_anchor not in app:
                  raise SystemExit("training render tail anchor missing")
              app = app.replace(render_anchor, render_replacement, 1)
          Path("src/app.js").write_text(app)

          # style.css: explicit dark canvases, hierarchy and mobile stacking.
          style = Path("style.css").read_text()
          css = r'''

/* ============================================================================
   Manager Training Scene v2
   Situasjon først, valg nummer to, dybde foldet. Eksisterende motorer beholdes.
   ============================================================================ */
.manager-surface.training-command-panel {
  padding: 0;
  overflow: hidden;
  border-bottom: 0;
  border-radius: 18px;
  background: #070b12;
  box-shadow: 0 18px 48px rgba(0, 0, 0, 0.34);
}
.training-command { display: grid; gap: 16px; padding: clamp(18px, 3vw, 30px); }
.training-command-head { display: flex; align-items: end; justify-content: space-between; gap: 20px; padding-bottom: 16px; border-bottom: 1px solid rgba(255, 255, 255, 0.18); }
.training-command-head h2 { margin: 2px 0 7px; font-size: clamp(2rem, 5vw, 3.2rem); line-height: 0.95; letter-spacing: -0.05em; }
.training-command-headline { max-width: 720px; margin: 0; color: #bac3ce; line-height: 1.5; }
.training-opponent-brief { display: grid; gap: 5px; min-width: min(300px, 38vw); border: 1px solid rgba(255, 255, 255, 0.26); border-radius: 14px; background: #111823; color: #f2f4f7; padding: 14px 16px; text-align: left; cursor: pointer; }
.training-opponent-brief:disabled { cursor: default; opacity: 0.72; }
.training-opponent-brief span,
.training-assistant-signal > span,
.training-load-brief > span,
.training-command-next span,
.training-command-status-label { color: #bac3ce; font-size: 0.7rem; font-weight: 900; letter-spacing: 0.11em; text-transform: uppercase; }
.training-opponent-brief strong { font-size: 1.22rem; }
.training-opponent-brief small { color: #bac3ce; line-height: 1.4; }
.training-command-reading { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(260px, 0.75fr); gap: 12px; }
.training-assistant-signal,
.training-load-brief { display: grid; align-content: start; gap: 8px; min-width: 0; border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 16px; background: #0f131b; padding: 18px; }
.training-assistant-signal { border-color: rgba(77, 163, 255, 0.5); }
.training-assistant-signal strong,
.training-load-brief strong { font-size: clamp(1.15rem, 2.5vw, 1.55rem); line-height: 1.2; }
.training-assistant-signal p,
.training-load-brief p { margin: 0; color: #d2d8e0; line-height: 1.5; }
.training-load-brief small { color: #bac3ce; line-height: 1.45; }
.training-load-brief[data-tone="negative"] { border-color: rgba(255, 107, 94, 0.58); }
.training-load-brief[data-tone="attention"] { border-color: rgba(255, 180, 84, 0.58); }
.training-command-status-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.training-command-status { position: relative; display: grid; align-content: start; gap: 6px; min-width: 0; min-height: 118px; border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 14px; background: #0c1119; color: #f2f4f7; padding: 14px; text-align: left; cursor: pointer; }
.training-command-status::before { content: ""; width: 34px; height: 3px; border-radius: 999px; background: rgba(255, 255, 255, 0.28); }
.training-command-status[data-tone="positive"]::before { background: #46d68c; }
.training-command-status[data-tone="attention"]::before { background: #ffb454; }
.training-command-status[data-tone="negative"]::before { background: #ff6b5e; }
.training-command-status:hover { border-color: rgba(255, 255, 255, 0.66); background: #151c27; }
.training-command-status-value { font-size: 1.1rem; line-height: 1.2; overflow-wrap: anywhere; }
.training-command-status-detail { color: #bac3ce; line-height: 1.4; }
.training-command-next { display: flex; align-items: center; justify-content: space-between; gap: 18px; border: 1px solid rgba(70, 214, 140, 0.48); border-radius: 16px; background: #0b1714; padding: 16px 18px; }
.training-command-next > div { display: grid; gap: 5px; }
.training-command-next strong { font-size: 1.12rem; }
.training-command-next small { color: #bac3ce; }
.training-command-action { min-height: 46px; border: 1px solid #f2f4f7; border-radius: 10px; background: #f2f4f7; color: #070b12; padding: 10px 16px; font-weight: 950; cursor: pointer; }
.training-command-action:hover { background: #ffffff; }
.training-depth { margin-top: 12px; border: 1px solid rgba(255, 255, 255, 0.16); border-radius: 14px; background: #080c13; }
.training-depth > summary { cursor: pointer; list-style: none; color: #bac3ce; font-size: 0.82rem; font-weight: 900; letter-spacing: 0.06em; padding: 14px 16px; text-transform: uppercase; }
.training-depth > summary::-webkit-details-marker { display: none; }
.training-depth > summary::after { content: " +"; color: #f2f4f7; }
.training-depth[open] > summary::after { content: " −"; }
.training-depth-content { display: grid; gap: 10px; padding: 0 16px 16px; }
.training-depth-content > .manager-surface { background: transparent; }
.training-workspace { margin-top: 14px; }
.training-workspace-step.is-open { border-bottom-color: rgba(255, 255, 255, 0.42); }
@media (max-width: 900px) {
  .training-command-head,
  .training-command-next { align-items: stretch; }
  .training-command-reading { grid-template-columns: 1fr; }
  .training-command-status-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 640px) {
  .training-command { gap: 13px; padding: 16px; }
  .training-command-head,
  .training-command-next { display: grid; }
  .training-opponent-brief { min-width: 0; width: 100%; }
  .training-command-status-grid { grid-template-columns: 1fr; }
  .training-command-status { min-height: 96px; }
  .training-command-action { width: 100%; }
  .training-depth-content { padding-inline: 12px; }
}
'''
          if "Manager Training Scene v2" not in style:
              Path("style.css").write_text(style.rstrip() + css + "\n")

          package_path = Path("package.json")
          package = json.loads(package_path.read_text())
          scripts = package.setdefault("scripts", {})
          scripts["audit:manager-training-scene-v2"] = "node scripts/audit-manager-training-scene-v2.mjs"
          scripts["sim:manager-training-scene-v2"] = "node scripts/simulate-manager-training-scene-v2.mjs"
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + "\n")
          PY
      - name: Install and validate new scene
        shell: bash
        run: |
          npm ci
          npm run check:syntax
          npm run check:dom-ids
          npm run sim:manager-training-scene-v2
          npm run audit:manager-training-scene-v2 || true
      - name: Commit materialized scene
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html src/app.js style.css package.json
          git commit -m "Bygg treningsscene v2"
          git push origin HEAD:agent/manager-training-scene-v2
