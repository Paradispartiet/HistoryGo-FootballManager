name: Materialize Manager Season Command v1

on:
  push:
    branches:
      - agent/manager-season-command-v1
    paths:
      - .github/workflows/materialize-manager-season-command-v1.yml
      - tools/materialize-manager-season-command-v1.py
      - tools/.season-command-payload/**

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/manager-season-command-v1
          fetch-depth: 0
      - name: Materialize season command center
        run: python3 tools/materialize-manager-season-command-v1.py
      - name: Verify generated source
        run: |
          node --check src/app.js
          node --check src/ui/manager-season-presentation.js
          node --check scripts/audit-manager-shell-v3.mjs
          node --check tests/browser/manager-season-scene-v1.spec.js
          node scripts/simulate-manager-season-scene-v1.mjs
      - name: Remove bootstrap files and publish branch
        run: |
          rm -rf tools/.season-command-payload
          rm -f tools/materialize-manager-season-command-v1.py
          rm -f .github/workflows/materialize-manager-season-command-v1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bygg sesongkontroll v1"
          git push origin HEAD:agent/manager-season-command-v1
