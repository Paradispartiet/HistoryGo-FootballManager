name: Verify Football Manager

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: football-manager-verify-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck TypeScript engine
        run: npm run typecheck
      - name: Audit Football Knowledge data
        run: npm run audit:knowledge
      - name: Audit seriepyramiden
        run: npm run audit:clubs
      - name: Audit klubbpool og spillerklubbtilknytning
        run: node scripts/sync-club-affiliations.mjs
      - name: Audit CI-dekning
        run: npm run audit:ci-coverage
      - name: Check syntax
        run: npm run check:syntax
      - name: Check DOM ids
        run: npm run check:dom-ids
      - name: Flow audit
        run: npm run audit:flow
      - name: Dead-end audit
        run: npm run audit:dead-ends
      - name: Audit Historical Opponent Archetypes
        run: npm run audit:historical-opponents
      - name: Audit tournaments
        run: npm run audit:tournaments
      - name: Audit tactics
        run: npm run audit:tactics
      - name: Build TypeScript engine
        run: npm run build
      - name: Stage and audit production artifact
        run: |
          npm run stage:pages
          npm run audit:pages-artifact
