name: Verify and deploy Football Manager

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Bare lesing på toppnivå. Deploy-jobben ber om det den trenger selv, slik at
# en PR-kjøring aldri har skriverettigheter mot Pages.
permissions:
  contents: read

concurrency:
  group: football-manager-verify-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck TypeScript engine
        run: npm run typecheck
      - name: Audit Football Knowledge data
        run: npm run audit:knowledge
      - name: Audit seriepyramiden
        run: npm run audit:clubs
      - name: Audit klubbpool og spillerklubbtilknytning
        run: node scripts/sync-club-affiliations.mjs
      - name: Audit CI-dekning
        run: npm run audit:ci-coverage
      - name: Check syntax
        run: npm run check:syntax
      - name: Check DOM ids
        run: npm run check:dom-ids
      - name: Flow audit
        run: npm run audit:flow
      - name: Dead-end audit
        run: npm run audit:dead-ends
      - name: Audit Historical Opponent Archetypes
        run: npm run audit:historical-opponents
      - name: Audit tournaments
        run: npm run audit:tournaments
      - name: Audit tactics
        run: npm run audit:tactics
      - name: Build TypeScript engine
        run: npm run build
      - name: Stage and audit production artifact
        run: |
          npm run stage:pages
          npm run audit:pages-artifact
      # En PR skal verifiseres, ikke publiseres. Opplastingen hoppes over der,
      # så PR-kjøringen er ren kontroll uten noe artefakt å deploye.
      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    # Denne jobben er den eneste som publiserer, og den kjøres aldri på PR.
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Formen her er den som FAKTISK har deployet: upload-pages-artifact@v3 +
      # deploy-pages@v5, uten et `configure-pages`-steg. Det er verdt å skrive
      # ned, fordi et forsøk på å «gjenopprette publisering» 18.08. gjorde tre
      # endringer og to av dem var feil vei — det la til configure-pages@v5 med
      # `enablement: true`, oppgraderte upload til v4 og NEDGRADERTE deploy fra
      # v5 til v4. Kjøringen falt på configure-pages etter ett sekund og hoppet
      # over hele resten, og fire timer senere ble deploy-jobben slettet i
      # stedet for rettet.
      #
      # `configure-pages` er ikke nødvendig her og var aldri med i den formen
      # som virket. Feiler denne jobben nå, er årsaken nesten alltid den samme
      # og den ligger IKKE i repoet: Pages-kilden i Settings → Pages må stå på
      # «GitHub Actions».
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
