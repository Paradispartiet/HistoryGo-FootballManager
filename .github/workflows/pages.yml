name: Build and deploy Football Manager

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: football-manager-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck TypeScript engine
        run: npm run typecheck

      - name: Audit Football Knowledge data
        run: npm run audit:knowledge

      - name: Check DOM ids (UI-lim)
        run: npm run check:dom-ids

      - name: Flow-audit (spilløkka henger sammen)
        run: npm run audit:flow

      - name: Dead-end-audit (ingen blindveier i første løkke)
        run: npm run audit:dead-ends

      - name: Audit Historical Opponent Archetypes
        run: npm run audit:historical-opponents

      - name: Build TypeScript engine
        run: npm run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
