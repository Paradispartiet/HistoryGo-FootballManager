name: Patch Season Flow Audit

on:
  push:
    branches:
      - agent/manager-season-command-v1
    paths:
      - .github/workflows/patch-season-flow-audit.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/manager-season-command-v1
          fetch-depth: 0
      - name: Update season flow contract
        run: python3 tools/patch-season-flow-audit.py
      - name: Verify exact season overview contract
        run: node scripts/audit-flow.mjs
      - name: Publish patch
        run: |
          rm -f tools/patch-season-flow-audit.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Oppdater flytvakt for sesongkontroll"
          git push origin HEAD:agent/manager-season-command-v1
