name: Manager flow CI contract fix

on:
  push:
    branches:
      - agent/manager-grunnflyt-v1

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/manager-grunnflyt-v1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Add explicit league-season gate
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/football-next-action.js')
          source = path.read_text()

          anchor = '  const firstTime = ctx.firstTime;\n'
          replacement = anchor + '  const leagueSeasonGateOpen = (!ctx.leagueModeActive || ctx.leagueSeasonActive);\n'
          assert source.count(anchor) == 1
          source = source.replace(anchor, replacement)

          old = '  if (!ctx.hasSession && ctx.matchdayReadiness.canStartMatch && clubWeekGate.isBlocked) {'
          new = '  if (!ctx.hasSession && leagueSeasonGateOpen && ctx.matchdayReadiness.canStartMatch && clubWeekGate.isBlocked) {'
          assert source.count(old) == 1
          source = source.replace(old, new)

          old = '  if (!ctx.hasSession && ctx.matchdayReadiness.canStartMatch && !clubWeekGate.isBlocked && !ctx.hasUnseenReport && clubWeek?.phase !== "review") {'
          new = '  if (!ctx.hasSession && leagueSeasonGateOpen && ctx.matchdayReadiness.canStartMatch && !clubWeekGate.isBlocked && !ctx.hasUnseenReport && clubWeek?.phase !== "review") {'
          assert source.count(old) == 1
          source = source.replace(old, new)

          path.write_text(source)
          PY

      - name: Verify contract and manager flow
        run: |
          npm ci
          npm run check:syntax
          npm run audit:flow
          npm run sim:manager-ground-flow-v1
          npm run sim:manager-flow-ui
          npm run audit:manager-shell-v3
          npm run typecheck
          npm run build

      - name: Commit source fix
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Gate match actions behind active league season'
          branch: agent/manager-grunnflyt-v1
          file_pattern: src/football-next-action.js
