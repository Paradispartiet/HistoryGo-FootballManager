name: Temporary Stromsgodset affiliation materializer
on:
  push:
    branches:
      - content/stromsgodset-source-final-20261018c
    paths:
      - .github/workflows/tmp-stromsgodset-affiliations.yml
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply source-backed canonical changes
        run: node scripts/tmp-stromsgodset-affiliations.mjs
      - name: Commit catalog and remove one-off workflow
        run: |
          rm -f .github/workflows/tmp-stromsgodset-affiliations.yml scripts/tmp-stromsgodset-affiliations.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/football_players.json .github/workflows/tmp-stromsgodset-affiliations.yml scripts/tmp-stromsgodset-affiliations.mjs
          git commit -m "data(stromsgodset): materialize ten verified affiliations"
          git push origin HEAD:content/stromsgodset-source-final-20261018c
