name: Temporary refresh training baseline

on:
  push:
    branches:
      - agent/manager-training-scene-v2
    paths:
      - .github/workflows/temp-refresh-training-baseline.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/manager-training-scene-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Fix program card semantics
        run: python scripts/temp-fix-training-program-accessibility.py
      - name: Install dependencies
        run: npm ci
      - name: Build engine
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Refresh intentional training snapshot
        run: npx playwright test tests/browser/manager-shell-v3.spec.js --project=chromium --grep "Trening · 768" --update-snapshots
      - name: Verify training accessibility
        run: npx playwright test tests/browser/manager-training-scene-v2.spec.js --project=chromium --grep "tilgjengelighetsbrudd"
      - name: Commit permanent changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.js tests/browser/manager-shell-v3.spec.js-snapshots/training-768-chromium-linux.png
          git commit -m "Rett treningskortsemantikk og baseline"
          git push origin HEAD:agent/manager-training-scene-v2
