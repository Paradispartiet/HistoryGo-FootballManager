name: Diagnose Office Simulations

on:
  push:
    branches:
      - agent/manager-office-inbox-v1

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update obsolete mode-isolation assertion
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path = Path("scripts/simulate-mode-isolation.mjs")
          text = path.read_text()
          old = '  assert.match(app, /\\.manager-portal, #offPitchSignalCard, \\.decision-strip/);'
          new = '  assert.match(app, /\\.office-command-panel, \\.office-depth, #offPitchSignalCard, \\.decision-strip/);'
          if old not in text:
              raise SystemExit("obsolete manager portal assertion not found")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Build TypeScript engine
        run: npm run build

      - name: Verify corrected simulation and publish fix
        shell: bash
        run: |
          set -euo pipefail
          npm run sim:mode-isolation
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/simulate-mode-isolation.mjs
          git commit -m "Update office mode-isolation contract"
          git push origin HEAD:${GITHUB_REF_NAME}
