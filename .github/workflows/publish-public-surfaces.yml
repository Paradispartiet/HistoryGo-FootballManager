name: Publish Football Manager public surfaces

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Publish the selected ref to preview or production
        type: choice
        options: [preview, production]
        default: preview

permissions:
  contents: read

concurrency:
  group: historygo-footballmanager-public-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PUBLIC_DEPLOY_TOKEN: ${{ secrets.PUBLIC_DEPLOY_TOKEN }}
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SOURCE_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
      MANUAL_TARGET: ${{ inputs.target }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify and build
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npm run audit:knowledge
          npm run audit:clubs
          node scripts/sync-club-affiliations.mjs
          npm run audit:ci-coverage
          npm run check:syntax
          npm run check:dom-ids
          npm run audit:flow
          npm run audit:dead-ends
          npm run audit:historical-opponents
          npm run audit:tournaments
          npm run audit:tactics
          npm run build
          npm run stage:pages
          npm run audit:pages-artifact
      - name: Prepare browser artifact
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          mode=production
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then mode=preview; fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then mode="${MANUAL_TARGET:-preview}"; fi
          rm -rf public-artifact
          cp -a _site public-artifact
          find public-artifact -type f -name '*.map' -delete
          printf '%s\n' "$SOURCE_SHA" > public-artifact/source-sha.txt
          printf '%s\n' "$SOURCE_REF" > public-artifact/source-ref.txt
          touch public-artifact/.nojekyll
          if [[ "$mode" == "preview" ]]; then
            target_repo='Paradispartiet/HistoryGo-FootballManager-preview'
            public_url='https://paradispartiet.github.io/HistoryGo-FootballManager-preview/'
          else
            target_repo='Paradispartiet/Paradispartiet.github.io'
            public_url='https://paradispartiet.github.io/HistoryGo-FootballManager/'
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "target_repo=$target_repo" >> "$GITHUB_OUTPUT"
          echo "public_url=$public_url" >> "$GITHUB_OUTPUT"
      - name: Check publisher credential
        id: credential
        shell: bash
        run: |
          if [[ -n "${PUBLIC_DEPLOY_TOKEN:-}" ]]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'PUBLIC_DEPLOY_TOKEN is not configured; verified build completed but publishing is skipped.'
          fi
      - name: Publish preview snapshot
        if: steps.credential.outputs.enabled == 'true' && steps.prepare.outputs.mode == 'preview'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          repo='Paradispartiet/HistoryGo-FootballManager-preview'
          git clone --depth 1 --branch site "https://x-access-token:${GH_TOKEN}@github.com/${repo}.git" target
          find target -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a public-artifact/. target/
          git -C target config user.name 'github-actions[bot]'
          git -C target config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C target add -A
          git -C target commit -m "preview: ${SOURCE_REF} ${SOURCE_SHA}" || true
          git -C target push origin site
          gh api --method POST "repos/${repo}/dispatches" -f event_type=publish-preview -f "client_payload[source_sha]=${SOURCE_SHA}"
      - name: Publish production snapshot
        if: steps.credential.outputs.enabled == 'true' && steps.prepare.outputs.mode == 'production'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          repo='Paradispartiet/Paradispartiet.github.io'
          git clone --filter=blob:none --no-checkout "https://x-access-token:${GH_TOKEN}@github.com/${repo}.git" target
          git -C target sparse-checkout init --cone
          git -C target sparse-checkout set HistoryGo-FootballManager
          git -C target checkout main
          rm -rf target/HistoryGo-FootballManager
          mkdir -p target/HistoryGo-FootballManager
          cp -a public-artifact/. target/HistoryGo-FootballManager/
          git -C target config user.name 'github-actions[bot]'
          git -C target config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C target add -A HistoryGo-FootballManager
          git -C target commit -m "deploy: Football Manager ${SOURCE_SHA}" || true
          for attempt in 1 2 3 4 5; do
            if git -C target push origin HEAD:main; then exit 0; fi
            git -C target fetch origin main
            git -C target rebase origin/main
            sleep $((attempt * 2))
          done
          exit 1
      - name: Verify published revision
        if: steps.credential.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          marker="${{ steps.prepare.outputs.public_url }}source-sha.txt"
          for i in $(seq 1 60); do
            actual="$(curl --location --fail --silent --max-time 20 "$marker" 2>/dev/null || true)"
            if [[ "$actual" == "$SOURCE_SHA" ]]; then
              echo "Published $SOURCE_REF at ${{ steps.prepare.outputs.public_url }}"
              exit 0
            fi
            sleep 5
          done
          echo "Published revision did not become visible: $marker" >&2
          exit 1
