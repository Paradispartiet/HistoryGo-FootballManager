name: Temporary materialize manager matchday scene v1

# Focused diagnostic of the materialized browser render path.
on:
  push:
    branches:
      - agent/manager-matchday-scene-v1
    paths:
      - .github/workflows/temp-materialize-manager-matchday-scene-v1.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/manager-matchday-scene-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Materialize matchday scene integration
        run: python scripts/temp-materialize-manager-matchday-scene-v1.py
      - name: Instrument matchday render path
        run: python scripts/temp-instrument-matchday-render.py
      - name: Install dependencies
        run: npm ci
      - name: Verify static integration
        run: |
          npm run check:syntax
          npm run check:dom-ids
          npm run audit:manager-matchday-scene-v1
          npm run sim:manager-matchday-scene-v1
          npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Diagnose rendered matchday scene
        run: npx playwright test tests/browser/temp-diagnose-manager-matchday-scene-v1.spec.js --project=chromium
      - name: Publish focused diagnostic
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add temp-matchday-diagnostic.json
          git commit -m "Oppdater instrumentert kampdagdiagnostikk"
          git push origin HEAD:agent/manager-matchday-scene-v1
