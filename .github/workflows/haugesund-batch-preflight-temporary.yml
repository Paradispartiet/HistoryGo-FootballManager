name: Temporary Haugesund batch preflight
on:
  push:
    branches: [content/haugesund-player-claims-20261017-c]
    paths: [.github/workflows/haugesund-batch-preflight-temporary.yml]
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Source-depth audit and exact Haugesund coverage
        run: |
          node scripts/audit-source-depth-claims.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {applyP1SourceClaims} from './src/football-player-source-claims-p1.js';
          import {applyP2SourceClaims} from './src/football-player-source-claims-p2.js';
          import {applySourceDepthClaims} from './src/football-player-source-claims-depth.js';
          const raw=JSON.parse(fs.readFileSync('data/football_players.json','utf8')).players;
          const players=applySourceDepthClaims(applyP2SourceClaims(applyP1SourceClaims(raw)));
          const ids=['joakim_vage_nilsen','trygve_nygaard','roope_riski','thore_pedersen','liban_abdi','haris_hajradinovi','filip_kiss'];
          for(const id of ids){
            const p=players.find(x=>x.id===id);
            const affiliation=p?.clubAffiliations?.find(a=>a.clubId==='haugesund');
            console.log('PLAYER '+JSON.stringify({id,found:!!p,aff:affiliation?.source,strengths:p?.strengths,places:p?.sourcePlaceIds}));
            if(!p || affiliation?.source!=='belagt' || !p.strengths?.length)process.exitCode=1;
          }
          const pool=players.filter(p=>p.clubAffiliations?.some(a=>a.clubId==='haugesund'));
          const exclusive=players.filter(p=>p.sourcePlaceIds?.length===1&&p.sourcePlaceIds[0]==='haugesund_stadion');
          const empty=exclusive.filter(p=>!p.strengths?.length);
          const cap=(Math.ceil(empty.length/exclusive.length*100)+1)/100;
          console.log('COVERAGE '+JSON.stringify({poolTotal:pool.length,poolMissing:pool.filter(p=>!p.strengths?.length).length,exclusive:exclusive.length,exclusiveMissing:empty.length,cap}));
          NODE