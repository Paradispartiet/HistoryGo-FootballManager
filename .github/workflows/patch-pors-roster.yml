name: Patch Pors roster hydration

on:
  push:
    branches:
      - agent/pors-p2-heritage

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pors-p2-heritage
          fetch-depth: 0

      - name: Resync roster when authoritative squad state hydrates
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/ui/manager-player-workspace-v1.js")
          source = path.read_text(encoding="utf-8")

          old_state = '''  if (squadState.playerPoolSquadVersion === 1) {
            return new Set(squadState.squadPlayerIds.filter((id) => players.some((player) => String(player.id) === id)));
          }'''
          new_state = '''  if (squadState.playerPoolSquadVersion === 1) {
            sessionPlayerPool.clear();
            squadState.squadPlayerIds
              .filter((id) => players.some((player) => String(player.id) === id))
              .forEach((id) => sessionPlayerPool.add(String(id)));
            return new Set(sessionPlayerPool);
          }'''

          old_local = '''  const starterIds = localIds.length ? [] : buildStarterSquadPlayerIds(players, [...starterCandidateIds], 15);
          const current = new Set([...starterIds, ...localIds]);'''
          new_local = '''  const starterIds = localIds.length ? [] : buildStarterSquadPlayerIds(players, [...starterCandidateIds], 15);
          const current = new Set([...starterIds, ...localIds]);
          if (localIds.length) sessionPlayerPool.clear();'''

          old_observer = '''const gate = document.getElementById("squadSetupGate"); if (gate) new MutationObserver(() => requestAnimationFrame(() => renderCompactStatus(liveRows()))).observe(gate, { subtree: true, childList: true, characterData: true, attributes: true });'''
          new_observer = '''const gate = document.getElementById("squadSetupGate"); if (gate) new MutationObserver(scheduleRosterRender).observe(gate, { subtree: true, childList: true, characterData: true, attributes: true });'''

          replacements = [
              (old_state, new_state, "authoritative squad state"),
              (old_local, new_local, "local-start cache reset"),
              (old_observer, new_observer, "full roster observer"),
          ]
          for old, new, label in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one {label} block, found {count}")
              source = source.replace(old, new, 1)

          path.write_text(source, encoding="utf-8")

      - name: Verify syntax
        run: node --check src/ui/manager-player-workspace-v1.js

      - name: Commit deterministic patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/manager-player-workspace-v1.js
          git commit -m "fix(ui): resync roster after squad hydration"
          git push origin HEAD:agent/pors-p2-heritage
