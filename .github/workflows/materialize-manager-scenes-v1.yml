name: Materialize manager scenes v1

on:
  workflow_dispatch:
  push:
    branches:
      - agent/matchday-lineup-scenes-v1-clean
    paths:
      - .github/workflows/materialize-manager-scenes-v1.yml

permissions:
  contents: write

concurrency:
  group: materialize-manager-scenes-v1-final
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout clean branch
        uses: actions/checkout@v4
        with:
          ref: agent/matchday-lineup-scenes-v1-clean
          fetch-depth: 0

      - name: Apply validated manager scenes patch
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_REF="origin/agent/matchday-lineup-scenes-v1"
          git fetch --no-tags origin \
            agent/matchday-lineup-scenes-v1 \
            agent/matchday-lineup-scenes-v1-clean

          git checkout "${SOURCE_REF}" -- \
            docs/MATCHDAY_LINEUP_SCENES_V1.md \
            scripts/audit-manager-shell-v3.mjs \
            scripts/simulate-manager-scenes-v1.mjs \
            src/ui/manager-lineup-presentation.js \
            src/ui/manager-matchday-presentation.js

          git show "${SOURCE_REF}:.github/manager-scenes-v1.diff.b64" \
            | tr -d '\n\r ' \
            | base64 --decode \
            | gunzip > /tmp/manager-scenes-v1.diff
          git apply --3way /tmp/manager-scenes-v1.diff

          python - <<'PY'
          from pathlib import Path

          path = Path("tests/browser/manager-shell-v3.spec.js")
          source = path.read_text(encoding="utf-8")

          before_each_old = 'test.beforeEach(async ({ page }) => {'
          before_each_new = 'test.beforeEach(async ({ page }, testInfo) => {'
          if before_each_old not in source:
              raise SystemExit("Expected beforeEach signature was not found")
          source = source.replace(before_each_old, before_each_new, 1)

          season_old = 'leagueSeasonStatus: "preseason"'
          if season_old not in source:
              raise SystemExit("Expected preseason fixture state was not found")
          source = source.replace(season_old, 'leagueSeasonStatus: "active"', 1)

          goto_old = '''  });
            await page.goto("/");
          '''
          goto_new = '''  });
            if (testInfo.title === "Kamp i gang · 1280") {
              await page.addInitScript(() => {
                localStorage.setItem("hgfm.weeklyTrainingFocus.v1", JSON.stringify({
                  focusId: "role_understanding",
                  week: 1,
                  appliedSessionId: null
                }));
                localStorage.setItem("hgfm.clubWeekState.v1", JSON.stringify({
                  week: 1,
                  phase: "matchday",
                  boardTrust: 50,
                  playerMorale: 50,
                  tacticalClarity: 50,
                  trainingCulture: 50,
                  mediaPressure: 50
                }));
              });
            }
            await page.goto("/");
          '''
          if goto_old not in source:
              raise SystemExit("Expected page.goto setup block was not found")
          source = source.replace(goto_old, goto_new, 1)

          training_old = '''  await page.locator('.app-subtab[data-tab-target="trening"]').click();
            const focusButton = page.locator("#weeklyTrainingOptions button:not([disabled])").first();
            await expect(focusButton).toBeVisible();
            await focusButton.click();
          '''
          training_new = '''  const trainingTab = page.locator('.app-subtab[data-tab-target="trening"]').first();
            await expect(trainingTab).toBeAttached();
            await trainingTab.evaluate((node) => node.click());
            const focusButton = page.locator("#weeklyTrainingOptions button:not([disabled])").first();
            await expect(focusButton).toBeAttached();
            await focusButton.evaluate((node) => node.click());
          '''
          if training_old not in source:
              raise SystemExit("Expected training helper block was not found")
          source = source.replace(training_old, training_new, 1)

          path.write_text(source, encoding="utf-8")
          PY

          git status --short

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Verify and generate locked scene baselines
        run: |
          npx playwright test tests/browser/manager-shell-v3.spec.js --grep "Kamp i gang · 1280" --update-snapshots
          npx playwright test tests/browser/manager-shell-v3.spec.js --update-snapshots

      - name: Run full validation
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npm run build
          npm run stage:pages
          npm run audit:pages-artifact

          npm run audit:knowledge
          npm run audit:ci-coverage
          npm run audit:clubs
          npm run audit:football-book-knowledge
          npm run audit:football-book-ux
          npm run audit:scenarios
          npm run audit:hg-football
          npm run audit:hg-historical-fit
          npm run audit:hg-coach-context
          npm run audit:hg-formation-knowledge
          npm run audit:historical-opponents
          npm run audit:tournaments
          npm run audit:tactics
          npm run audit:attributes

          npm run check:syntax
          npm run check:dom-ids
          npm run audit:flow
          npm run audit:dead-ends
          npm run audit:manager-shell-v3

          npm run sim:matchday
          npm run sim:mini-season
          npm run sim:tournament
          npm run sim:match-plan
          npm run sim:pitch-layout
          npm run sim:training-week
          npm run sim:training-plan
          npm run sim:individual-training
          npm run sim:player-weaknesses
          npm run sim:player-attributes
          npm run sim:formation-matchup
          npm run sim:suggested-setups
          npm run sim:training-programs
          npm run sim:off-pitch
          npm run sim:inbox
          npm run sim:club-week
          npm run sim:role-learning
          npm run sim:staff-identity
          npm run sim:manager-flow-ui
          npm run sim:manager-ground-flow-v1
          node scripts/simulate-manager-scenes-v1.mjs
          npm run sim:role-familiarity
          npm run sim:league-season
          npm run sim:mode-isolation
          npm run sim:first-time
          npm run sim:first-run-real-seed
          npm run sim:first-run-football-book-qa
          npm run sim:player-stats
          npm run sim:substitutions
          npm run sim:player-condition
          npm run sim:scenarios
          npm run sim:season-review
          npm run sim:federation-verdict
          npm run sim:league-playoff
          npm run sim:club-selection
          npm run sim:club-tradition
          npm run sim:club-squad

          npm run test:browser

      - name: Commit and push permanent changes
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="agent/matchday-lineup-scenes-v1-clean"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No permanent changes to commit."
            exit 1
          fi

          if git diff --cached --name-only | grep -Eq \
            '(^|/)(manager-scenes-v1\.diff\.b64|export-manager-scenes-source\.yml|inspect-manager-scenes-test\.yml|manager-scenes-v1-apply\.yml|manager-scenes-v1-build(-retry)?\.yml|manager-scenes-v1-finalize\.yml)$'; then
            echo "Temporary materialization artifacts were staged."
            exit 1
          fi

          git commit -m "Build manager lineup and matchday scenes v1"

          for attempt in 1 2 3; do
            git fetch --no-tags origin "${BRANCH}"
            git rebase "origin/${BRANCH}"
            if git push origin "HEAD:${BRANCH}"; then
              exit 0
            fi
            echo "Push attempt ${attempt} failed; retrying against latest branch head."
            sleep 3
          done

          echo "Unable to push permanent manager scenes changes after three attempts."
          exit 1
