name: CI

# PR runs once (not again on the feature-branch push). Only source-depth
# record edits get player/group lanes; code changes and weekly/manual runs get
# the full suite. Pages builds and deploys separately on main.
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Test CI routing
        run: node scripts/classify-player-ci.mjs --self-test

      - name: Fetch PR base for scope detection
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git fetch --no-tags --depth=1 origin "$PR_BASE_SHA" || echo "Base unavailable: using full CI"

      - name: Select CI lane
        id: scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/classify-player-ci.mjs

      - name: Install dependencies
        run: npm ci

      - name: Player claim validation (each player)
        if: steps.scope.outputs.lane != 'full'
        run: |
          npm run audit:source-depth-claims
          npm run audit:p2-source-claims
          npm run audit:attributes
          node scripts/audit-eliteserien-player-strength-coverage.mjs --check

      - name: Batch validation (five or more new players)
        if: steps.scope.outputs.lane == 'group'
        run: |
          npm run sim:player-attributes
          npm run sim:club-squad
          npm run sim:mini-season

      - name: Typecheck TypeScript engine
        if: steps.scope.outputs.lane == 'full'
        run: npm run typecheck

      - name: Build TypeScript engine
        if: steps.scope.outputs.lane == 'full'
        run: npm run build

      - name: Audit Pages artifact
        if: steps.scope.outputs.lane == 'full'
        run: |
          npm run stage:pages
          npm run audit:pages-artifact

      - name: Data audits
        if: steps.scope.outputs.lane == 'full'
        run: |
          npm run audit:knowledge
          npm run audit:ci-coverage
          npm run audit:product-status
          npm run audit:clubs
          npm run audit:club-heritage
          npm run audit:import-club-heritage
          npm run audit:nff-squad
          node scripts/sync-club-affiliations.mjs
          npm run audit:football-book-knowledge
          npm run audit:football-book-ux
          npm run audit:scenarios
          npm run audit:hg-football
          npm run audit:hg-historical-fit
          npm run audit:hg-coach-context
          npm run audit:hg-formation-knowledge
          npm run audit:historical-opponents
          npm run audit:tournaments
          npm run audit:tactics
          npm run audit:attributes
          npm run audit:p2-source-claims
          npm run audit:source-depth-claims
          node scripts/audit-eliteserien-player-strength-coverage.mjs --check
          node scripts/audit-p1-source-claims.mjs

      - name: UI-/flyt-vakter
        if: steps.scope.outputs.lane == 'full'
        run: |
          node --check scripts/cleanup-merged-branches.mjs
          npm run check:syntax
          npm run check:dom-ids
          npm run audit:flow
          npm run audit:dead-ends
          npm run audit:manager-shell-v3
          npm run audit:manager-office-inbox-v1
          npm run audit:manager-training-scene-v2
          npm run audit:manager-training-exercise-design-v1
          npm run audit:manager-club-operations-v1
          npm run audit:manager-club-organization-v1
          npm run audit:manager-matchday-scene-v1
          npm run audit:manager-match-calendar-v1
          npm run audit:manager-post-match-analysis-v1
          npm run audit:manager-squad-tactics-scene-v2
          npm run audit:manager-scouting-workspace-v1
          npm run audit:manager-recruitment-v1
          npm run audit:manager-calendar-v1
          npm run audit:manager-club-communication-v2
          npm run audit:manager-club-communication-v3
          npm run audit:manager-staff-roster-v1
          npm run audit:eliteserien-staff-coverage
          npm run audit:manager-visual-identity-v1
          npm run audit:manager-legacy-cleanup-v1
          node scripts/audit-manager-football-learning-loop-v1.mjs

      - name: Simuleringer (motorer ende-til-ende)
        if: steps.scope.outputs.lane == 'full'
        run: |
          npm run sim:matchday
          npm run sim:mini-season
          npm run sim:tournament
          npm run sim:match-plan
          npm run sim:pitch-layout
          npm run sim:training-week
          npm run sim:training-plan
          npm run sim:individual-training
          npm run sim:player-weaknesses
          npm run sim:player-attributes
          npm run sim:formation-matchup
          npm run sim:suggested-setups
          npm run sim:training-programs
          npm run sim:off-pitch
          npm run sim:inbox
          npm run sim:club-week
          npm run sim:role-learning
          npm run sim:staff-identity
          npm run sim:manager-flow-ui
          npm run sim:manager-ground-flow-v1
          npm run sim:manager-season-scene-v1
          npm run sim:manager-office-inbox-v1
          npm run sim:manager-training-scene-v2
          npm run sim:manager-training-exercise-design-v1
          npm run sim:manager-club-organization-v1
          npm run sim:manager-matchday-scene-v1
          npm run sim:manager-match-calendar-v1
          npm run sim:manager-post-match-analysis-v1
          npm run sim:manager-squad-tactics-scene-v2
          npm run sim:manager-scouting-workspace-v1
          npm run sim:manager-recruitment-v1
          npm run sim:manager-calendar-v1
          npm run sim:manager-club-communication-v2
          npm run sim:manager-club-communication-v3
          npm run sim:manager-staff-roster-v1
          npm run sim:manager-visual-identity-v1
          npm run sim:manager-legacy-cleanup-v1
          node scripts/simulate-manager-football-learning-loop-v1.mjs
          npm run sim:role-familiarity
          npm run sim:league-season
          npm run sim:mode-isolation
          npm run sim:first-time
          npm run sim:first-run-real-seed
          npm run sim:first-run-football-book-qa
          npm run sim:player-stats
          npm run sim:substitutions
          npm run sim:player-condition
          npm run sim:medical-rehabilitation-v2
          npm run sim:scenarios
          npm run sim:season-review
          npm run sim:federation-verdict
          npm run sim:league-playoff
          npm run sim:club-selection
          npm run sim:club-tradition
          npm run sim:club-squad

      - name: Installer Chromium for nettleservakter
        if: steps.scope.outputs.lane == 'full'
        run: npx playwright install --with-deps chromium

      - name: Responsive nettleservakter og visuelle differanser
        if: steps.scope.outputs.lane == 'full'
        run: npm run test:browser
