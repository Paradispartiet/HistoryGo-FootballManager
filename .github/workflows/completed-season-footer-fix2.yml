name: Completed season footer fix 2

on:
  push:
    branches:
      - agent/completed-season-footer-fixdiag2-20260920

permissions:
  contents: read

jobs:
  targeted-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run completed season footer regression
        run: |
          npx playwright test tests/browser/manager-season-scene-v1.spec.js --project=chromium -g "fullført sesong bruker sesongslutt i footer i stedet for ny manageruke"
