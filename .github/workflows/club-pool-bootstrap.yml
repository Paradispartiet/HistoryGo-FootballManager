name: Bootstrap club pool integrity

on:
  push:
    branches:
      - agent/club-pool-save-integrity-v1
    paths:
      - .github/workflows/club-pool-bootstrap.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/club-pool-save-integrity-v1
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Koble besøkt stadion til hele klubbpoolen
        run: node scripts/apply-club-pool-followup-v1.mjs

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.js
          git diff --cached --quiet && exit 0
          git commit -m "Åpne hele klubbpoolen ved stadionbesøk"
          git push origin HEAD:agent/club-pool-save-integrity-v1
