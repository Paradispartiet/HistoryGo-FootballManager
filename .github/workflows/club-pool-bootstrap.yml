name: Integrate club pool save integrity

on:
  push:
    branches:
      - agent/club-pool-save-integrity-v1
    paths:
      - .github/workflows/club-pool-bootstrap.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/club-pool-save-integrity-v1
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Integrer siste main uten å miste nye spillerdata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            printf 'Konflikter:\n%s\n' "$conflicts"
            unexpected="$(printf '%s\n' "$conflicts" | grep -Ev '^(data/football_players.json|docs/klubbvalg.md)$' || true)"
            if [ -n "$unexpected" ]; then
              printf 'Uventede mergekonflikter:\n%s\n' "$unexpected" >&2
              exit 1
            fi
            for path in data/football_players.json docs/klubbvalg.md; do
              if printf '%s\n' "$conflicts" | grep -Fxq "$path"; then
                git checkout --theirs -- "$path"
                git add "$path"
              fi
            done
          fi

      - name: Regenerer eksplisitte klubbtilknytninger fra fersk main
        run: node scripts/sync-club-affiliations.mjs --write

      - name: Flytt Speiding over på canonical klubbtilknytning
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/ui/manager-scouting-workspace-v1.js")
          text = path.read_text()

          old_import = '''import {
            CLUB_STATUS_LABEL,
            clubStatusFor,
            listClubHeritagePlayers
          } from "../football-club-squad.js";'''
          new_import = '''import {
            CLUB_STATUS_LABEL,
            clubAffiliationFor,
            listClubHeritagePlayers
          } from "../football-club-squad.js";'''
          assert old_import in text, "fant ikke gammel club-squad-import"
          text = text.replace(old_import, new_import, 1)

          old_candidates = 'const candidates = listClubHeritagePlayers({ homePlaceId: club.homePlaceId || null, players });'
          new_candidates = 'const candidates = listClubHeritagePlayers({ clubId: club.id, homePlaceId: club.homePlaceId || null, players });'
          assert old_candidates in text, "fant ikke gammelt heritage-oppslag"
          text = text.replace(old_candidates, new_candidates, 1)

          old_status = 'const status = clubStatusFor(player, club.homePlaceId);'
          new_status = 'const status = clubAffiliationFor(player, club.id)?.status || null;'
          assert old_status in text, "fant ikke gammel klubbstatus-lesning"
          text = text.replace(old_status, new_status, 1)

          text = text.replace(
            "spillerne HG-dataene knytter til klubbens stadion.",
            "spillerne HG-dataene knytter eksplisitt til klubben.",
            1,
          )
          text = text.replace(
            "Ingen klubbtilknyttede spillere er registrert for denne banen i HG-dataene ennå.",
            "Ingen klubbtilknyttede spillere er registrert for denne klubben i HG-dataene ennå.",
            1,
          )
          path.write_text(text)

      - name: Oppdater Speiding-simuleringen til ny datakontrakt
        shell: python
        run: |
          from pathlib import Path

          path = Path("scripts/simulate-manager-scouting-workspace-v1.mjs")
          text = path.read_text()
          start = text.index("const players = [")
          end = text.index("\n];", start) + 3
          replacement = '''const players = [
            { id: "maker", name: "Maker", nationality: "Norge", naturalPositions: ["AM"], usablePositions: ["CM"], preferredRoles: ["classic_ten"], sourcePlaceIds: ["ground_a"], clubAffiliations: [{ clubId: "ours", relation: "played_for", status: "club_profile", source: "belagt" }] },
            { id: "stopper", name: "Stopper", nationality: "Norge", naturalPositions: ["CB"], usablePositions: [], preferredRoles: ["stopper"], sourcePlaceIds: ["ground_b"], clubAffiliations: [{ clubId: "other", relation: "played_for", status: "club_profile", source: "belagt" }] },
            { id: "runner", name: "Runner", nationality: "Norge", naturalPositions: ["ST"], usablePositions: [], preferredRoles: ["advanced_forward"], sourcePlaceIds: ["ground_a"], clubAffiliations: [{ clubId: "ours", relation: "played_for", status: "squad_profile", source: "utledet" }] },
            { id: "tourist", name: "Tourist", nationality: "Norge", naturalPositions: ["CM"], usablePositions: [], preferredRoles: [], sourcePlaceIds: ["ground_b"] }
          ];'''
          text = text[:start] + replacement + text[end:]

          needle = 'check("andre klubb får dokumentert spillerpool", clubRows[0].candidates.length === 1 && clubRows[0].candidates[0].id === "stopper");'
          assert needle in text, "fant ikke klubbpool-sjekken"
          text = text.replace(
            needle,
            needle + '\ncheck("sourcePlaceIds alene gir ikke klubbmedlemskap", !clubRows[0].candidates.some((player) => player.id === "tourist"));',
            1,
          )
          path.write_text(text)

      - name: Bevar klubbpool-kontrakten i klubbvalg-dokumentasjonen
        shell: python
        run: |
          from pathlib import Path

          path = Path("docs/klubbvalg.md")
          text = path.read_text()
          marker = "## Klubbpool v1: medlemskap og tilgang"
          if marker not in text:
            text = text.rstrip() + '''\n\n## Klubbpool v1: medlemskap og tilgang\n\nKlubbmedlemskap, History Go-oppdagelse og stadiontilgang er tre forskjellige fakta.\n`player.clubAffiliations` bestemmer hvilken klubbpool spilleren tilhører.\n`player.sourcePlaceIds` bestemmer bare hvor spilleren kan oppdages i History Go.\n`club.homePlaceId` bestemmer hvilket stadionbesøk som åpner hele klubbpoolen.\n\nEn klubb kan bare overtas når den har minst 15 dokumenterte spillere i sin egen\npool. Uferdige pooler står som `pending` og fylles aldri med tilfeldige spillere\nfra andre klubber. Gamle automatiske grunntropper repareres mot den valgte\nklubbens canonical pool ved lasting, slik at eldre saves ikke beholder fremmede\nspillere etter migreringen.\n'''
            path.write_text(text)

      - name: Fjern midlertidige bootstrap-filer
        run: |
          rm -f .github/workflows/club-pool-bootstrap.yml
          rm -f scripts/apply-club-pool-followup-v1.mjs
          rm -f scripts/apply-club-pool-save-integrity-v1.mjs

      - name: Installer avhengigheter og kjør målrettede porter
        run: |
          npm ci
          npm run typecheck
          node scripts/sync-club-affiliations.mjs
          node scripts/simulate-manager-scouting-workspace-v1.mjs
          node scripts/simulate-club-selection.mjs
          node scripts/simulate-club-squad.mjs
          npm run check:syntax
          git diff --check

      - name: Commit og push ferdig integrasjon
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --stat
          git diff --cached --quiet && exit 0
          git commit -m "Fullfør klubbpool-saveintegritet mot fersk main"
          git push origin HEAD:agent/club-pool-save-integrity-v1
