name: Bootstrap club pool integrity

on:
  push:
    branches:
      - agent/club-pool-save-integrity-v1
    paths:
      - .github/workflows/club-pool-bootstrap.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/club-pool-save-integrity-v1
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Materialiser klubbtilknytninger
        run: node scripts/sync-club-affiliations.mjs --write

      - name: Patch app og dokumentasjon
        run: node scripts/apply-club-pool-save-integrity-v1.mjs

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/football_players.json data/football_clubs.json src/app.js docs/klubbvalg.md
          git diff --cached --quiet && exit 0
          git commit -m "Materialiser klubbpool og save-integritet"
          git push origin HEAD:agent/club-pool-save-integrity-v1
