name: Remove duplicate starter helper

on:
  push:
    branches:
      - agent/recruitment-v1
    paths:
      - .github/workflows/recruitment-v1-remove-duplicate-starter.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/recruitment-v1
      - name: Remove dead local starter implementation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/ui/manager-player-workspace-v1.js')
          text = p.read_text()
          groups = '''const STARTER_SQUAD_GROUPS = Object.freeze([\n  { positions: ["GK"], count: 2 },\n  { positions: ["CB", "LB", "RB", "WB"], count: 5 },\n  { positions: ["DM", "CM", "AM"], count: 5 },\n  { positions: ["ST", "LW", "RW"], count: 3 }\n]);\n\n'''
          helper = '''function buildStarterSquad(players, candidateIds, limit = 15) {\n  const candidates = asArray(players).filter((player) => candidateIds.has(String(player.id))).sort((a, b) =>\n    (Number(a.classHeight) || 0) - (Number(b.classHeight) || 0) || String(a.id).localeCompare(String(b.id))\n  );\n  const chosen = [];\n  const used = new Set();\n  const playsIn = (player, positions) => [...asArray(player.naturalPositions), ...asArray(player.usablePositions)].some((position) => positions.includes(position));\n  STARTER_SQUAD_GROUPS.forEach((group) => {\n    let need = group.count;\n    candidates.forEach((player) => {\n      if (need <= 0 || chosen.length >= limit || used.has(player.id) || !playsIn(player, group.positions)) return;\n      chosen.push(String(player.id)); used.add(player.id); need -= 1;\n    });\n  });\n  candidates.forEach((player) => { if (chosen.length < limit && !used.has(player.id)) { chosen.push(String(player.id)); used.add(player.id); } });\n  return chosen;\n}\n\n'''
          if text.count(groups) != 1 or text.count(helper) != 1:
              raise SystemExit(f'anchors: groups={text.count(groups)} helper={text.count(helper)}')
          p.write_text(text.replace(groups, '', 1).replace(helper, '', 1))
          PY
      - name: Commit cleanup
        run: |
          rm .github/workflows/recruitment-v1-remove-duplicate-starter.yml
          git config user.name "Paradispartiet"
          git config user.email "paradispartiet@gmail.com"
          git add src/ui/manager-player-workspace-v1.js .github/workflows/recruitment-v1-remove-duplicate-starter.yml
          git commit -m "Remove duplicate starter squad implementation"
          git push origin HEAD:agent/recruitment-v1
