name: Temporary source batch inventory
on:
  push:
    branches: [content/stromsgodset-source-batch-20261017-b]
    paths: [.github/workflows/source-batch-preflight-temporary.yml]
permissions: {contents: read}
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check eleven claims, affiliations and exact cap
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {applyP1SourceClaims} from './src/football-player-source-claims-p1.js';
          import {applyP2SourceClaims} from './src/football-player-source-claims-p2.js';
          import {applySourceDepthClaims} from './src/football-player-source-claims-depth.js';
          const raw=JSON.parse(fs.readFileSync('data/football_players.json','utf8')).players;
          const players=applySourceDepthClaims(applyP2SourceClaims(applyP1SourceClaims(raw)));
          const selected=['thomas_grogaard','johan_hove','thomas_lehne_olsen','sondre_fosnaess_hanssen','jorgen_horn','martin_ronning_ovenstad','morten_saetra','odd_johnsen','adam_larsen_kwarasey','flamur_kastrati','bassel_jradi'];
          for(const id of selected){
            const p=players.find(p=>p.id===id);
            console.log('CLAIM '+JSON.stringify({id,exists:!!p,strengths:p?.strengths,aff:p?.clubAffiliations?.find(x=>x.clubId==='stromsgodset'),places:p?.sourcePlaceIds}));
            if(!p||!p.strengths?.length||!p.clubAffiliations?.some(a=>a.clubId==='stromsgodset'&&a.source==='belagt'))process.exitCode=1;
          }
          const pool=players.filter(p=>p.clubAffiliations?.some(a=>a.clubId==='stromsgodset'));
          const exclusive=players.filter(p=>p.sourcePlaceIds?.length===1&&p.sourcePlaceIds[0]==='marienlyst_stadion');
          const empty=exclusive.filter(p=>!p.strengths?.length);
          const cap=(Math.ceil(empty.length/exclusive.length*100)+1)/100;
          console.log('COVERAGE '+JSON.stringify({poolTotal:pool.length,poolMissing:pool.filter(p=>!p.strengths?.length).length,exclusive:exclusive.length,exclusiveMissing:empty.length,cap}));
          NODE
      - name: Targeted source-depth audit
        run: node scripts/audit-source-depth-claims.mjs
