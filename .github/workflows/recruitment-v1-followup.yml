name: Recruitment v1 semantic follow-up

on:
  push:
    branches:
      - agent/recruitment-v1
    paths:
      - .github/workflows/recruitment-v1-followup.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/recruitment-v1
      - name: Preserve collection semantics and cross-tab refresh
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app.js')
          text = p.read_text()
          old = '''  const collectedPools = {\n    unlockedPlaceIds,\n    unlockedPlayerIds,\n    unlockedStaffIds: new Set(unlockedStaff.map((member) => member.id)),'''
          new = '''  const collectedPlayerIds = new Set([...candidatePlayerIds, ...getLocalStartPlayerIds()]);\n  const collectedPools = {\n    unlockedPlaceIds,\n    unlockedPlayerIds: collectedPlayerIds,\n    unlockedStaffIds: new Set(unlockedStaff.map((member) => member.id)),'''
          if text.count(old) != 1:
              raise SystemExit('collectedPools anchor mismatch')
          text = text.replace(old, new, 1)
          old = '''      event.key === HISTORY_GO_VISITED_PLACES_KEY ||\n      event.key === HISTORY_GO_GROUNDHOPPER_STATS_KEY'''
          new = '''      event.key === HISTORY_GO_VISITED_PLACES_KEY ||\n      event.key === HISTORY_GO_GROUNDHOPPER_STATS_KEY ||\n      event.key === TEAM_MERITS_KEY'''
          if text.count(old) != 1:
              raise SystemExit('storage anchor mismatch')
          text = text.replace(old, new, 1)
          p.write_text(text)
          PY
      - name: Commit follow-up
        run: |
          rm .github/workflows/recruitment-v1-followup.yml
          git config user.name "Paradispartiet"
          git config user.email "paradispartiet@gmail.com"
          git add src/app.js .github/workflows/recruitment-v1-followup.yml
          git commit -m "Preserve collection semantics in recruitment v1"
          git push origin HEAD:agent/recruitment-v1
