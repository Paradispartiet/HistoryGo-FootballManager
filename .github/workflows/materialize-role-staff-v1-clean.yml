'''
          (root / 'src/ui/manager-staff-workspace-v1.css').write_text(css, encoding='utf-8')

          # Staff catalogue: preserve all real profiles; add only explicit placeholders for missing roles.
          staff_path = root / 'data/football_staff.json'
          staff_data = json.loads(staff_path.read_text(encoding='utf-8'))
          staff = staff_data.get('staff', [])
          starter_ids = {'ullevaal_final_pressure_mentor', 'ekeberg_recruitment_coach', 'bislett_speed_specialist'}
          for member in staff:
            if member.get('id') in starter_ids:
              member['starterStaff'] = True
          additions = [
            {
              'id': 'kfum_training_coach', 'name': 'KFUM treningscoach', 'staffType': 'coach',
              'isPlaceholder': True, 'needsResearch': True, 'starterStaff': True,
              'canBeHiredAs': ['coach'], 'sourcePlaceIds': ['kfum_arena'],
              'expertiseIds': ['development_culture', 'passing_training', 'team_organisation'],
              'roles': ['field_coach', 'player_development_coach'],
              'fitsClubs': ['development_project', 'modern_training_environment'],
              'warningWhenMisused': 'Denne plassholderprofilen representerer en ordinær treningscoach og skal erstattes når en dokumentert klubbperson er kuratert.'
            },
            {
              'id': 'bislett_first_team_physio', 'name': 'Bislett førstelagsfysio', 'staffType': 'physio',
              'isPlaceholder': True, 'needsResearch': True, 'starterStaff': True,
              'canBeHiredAs': ['physio'], 'sourcePlaceIds': ['bislett_stadion'],
              'expertiseIds': ['load_management', 'physical_preparation'],
              'roles': ['first_team_physio', 'load_management'],
              'fitsClubs': ['high_intensity_team', 'development_project'],
              'warningWhenMisused': 'Denne plassholderprofilen representerer fysiorollen, ikke en identifisert virkelig person.'
            },
            {
              'id': 'ullevaal_goalkeeper_coach', 'name': 'Ullevaal keepertrener', 'staffType': 'goalkeeper_coach',
              'isPlaceholder': True, 'needsResearch': True, 'starterStaff': True,
              'canBeHiredAs': ['goalkeeper_coach'], 'sourcePlaceIds': ['ullevaal_stadion'],
              'expertiseIds': ['team_organisation', 'match_discipline'],
              'roles': ['goalkeeper_development', 'match_preparation_coach'],
              'fitsClubs': ['development_project', 'big_match_team'],
              'warningWhenMisused': 'Denne plassholderprofilen representerer keepertrenerrollen, ikke en identifisert virkelig person.'
            }
          ]
          existing = {member.get('id') for member in staff}
          staff.extend(item for item in additions if item['id'] not in existing)
          staff_path.write_text(json.dumps(staff_data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Load the staff workspace through the already-imported manager shell module.
          shell_path = root / 'src/ui/manager-shell-view.js'
          shell = shell_path.read_text(encoding='utf-8')
          anchor = 'import "./manager-calendar-workspace-v1.js";'
          if 'manager-staff-workspace-v1.js' not in shell:
            if anchor not in shell: raise SystemExit('manager-shell-view import anchor missing')
            shell = shell.replace(anchor, anchor + '\nimport "./manager-staff-workspace-v1.js";', 1)
          shell_path.write_text(shell, encoding='utf-8')

          # Minimal integration in the large controller: reuse the pure model, do not create parallel state.
          app_path = root / 'src/app.js'
          app = app_path.read_text(encoding='utf-8')
          import_anchor = 'import { migrateLegacyRecruitmentState, normalizeRecruitmentState } from "./football-recruitment.js";'
          staff_import = 'import { decorateHiredStaffWithAssignments, selectStarterStaffCandidates, summarizeStaffRoster } from "./football-staff-roster.js";'
          if staff_import not in app:
            if import_anchor not in app: raise SystemExit('app import anchor missing')
            app = app.replace(import_anchor, import_anchor + '\n' + staff_import, 1)
          if 'const REQUIRED_STAFF_SIZE = 3;' not in app: raise SystemExit('old staff size constant missing')
          app = app.replace('const REQUIRED_STAFF_SIZE = 3;', 'const REQUIRED_STAFF_SIZE = 6;', 1)

          starter_pattern = re.compile(r'''function getStarterSquadStaffCandidates\(staff, limit = REQUIRED_STAFF_SIZE\) \{\n  if \(!isStarterSquadActive\(\)\) return \[\];\n  const list = Array\.isArray\(staff\) \? staff\.filter\(\(member\) => member && member\.id\) : \[\];\n  return \[\.\.\.list\]\n    \.sort\(\(a, b\) => String\(a\.id\)\.localeCompare\(String\(b\.id\)\)\)\n    \.slice\(0, Math\.max\(0, limit\)\);\n\}''')
          replacement = '''function getStarterSquadStaffCandidates(staff) {\n  if (!isStarterSquadActive()) return [];\n  return selectStarterStaffCandidates(staff);\n}'''
          app, count = starter_pattern.subn(replacement, app, count=1)
          if count != 1: raise SystemExit(f'starter staff function patch count={count}')
          app = app.replace('const starterStaff = getStarterSquadStaffCandidates(staff, REQUIRED_STAFF_SIZE + 2);', 'const starterStaff = getStarterSquadStaffCandidates(staff);', 1)

          hired_pattern = re.compile(r'''function getHiredStaff\(\) \{\n  const hiredIds = new Set\(\n    Array\.isArray\(state\.teamMerits\?\.hiredStaffIds\) \? state\.teamMerits\.hiredStaffIds : \[\]\n  \);\n  return getUnlockedStaff\(\)\.filter\(\(member\) => hiredIds\.has\(member\.id\)\);\n\}''')
          hired_replacement = '''function getHiredStaff() {\n  const hiredIds = new Set(\n    Array.isArray(state.teamMerits?.hiredStaffIds) ? state.teamMerits.hiredStaffIds : []\n  );\n  const hired = getUnlockedStaff().filter((member) => hiredIds.has(member.id));\n  return decorateHiredStaffWithAssignments(hired);\n}'''
          app, count = hired_pattern.subn(hired_replacement, app, count=1)
          if count != 1: raise SystemExit(f'getHiredStaff patch count={count}')

          # Pre-season must validate ROLE COVERAGE, not merely six arbitrary people.
          marker = 'const hiredStaff = getHiredStaff().length;'
          if marker not in app: raise SystemExit('preseason hiredStaff marker missing')
          app = app.replace(marker, 'const staffRoster = summarizeStaffRoster(getHiredStaff());\n  const hiredStaff = staffRoster.filledCount;', 1)
          old_item = '{ id: "stab", title: "Velg stab", done: hiredStaff >= REQUIRED_STAFF_SIZE, detail: `${hiredStaff}/${REQUIRED_STAFF_SIZE} stabsmedlemmer valgt. Tilgjengelig stab teller først når du faktisk engasjerer dem.`, tab: "historygo" },'
          new_item = '{ id: "stab", title: "Velg stab", done: staffRoster.complete, detail: staffRoster.complete ? "Førstelagsstaben er komplett: assistenttrener, tre trenere, fysio og keepertrener." : `${hiredStaff}/${REQUIRED_STAFF_SIZE} roller dekket. Mangler: ${staffRoster.missingLabel || "rolledekning"}.`, tab: "admin" },'
          if old_item not in app: raise SystemExit('preseason staff checklist item missing')
          app = app.replace(old_item, new_item, 1)
          # Any direct boolean gate using the old count becomes the same role-aware truth.
          app = app.replace('getHiredStaff().length >= REQUIRED_STAFF_SIZE', 'summarizeStaffRoster(getHiredStaff()).complete')
          app_path.write_text(app, encoding='utf-8')

          sim = r'''import fs from "node:fs";
import assert from "node:assert/strict";
import { REQUIRED_FIRST_TEAM_STAFF, STAFF_ROLE_REQUIREMENTS, assignFirstTeamStaff, decorateHiredStaffWithAssignments, selectStarterStaffCandidates, summarizeStaffRoster } from "../src/football-staff-roster.js";

const data = JSON.parse(fs.readFileSync(new URL("../data/football_staff.json", import.meta.url), "utf8"));
const staff = data.staff || [];
let checks = 0;
function check(condition, message) { assert.ok(condition, message); checks += 1; console.log(`✓ ${checks}. ${message}`); }

check(REQUIRED_FIRST_TEAM_STAFF === 6, "førstelagsstaben krever seks personer");
check(STAFF_ROLE_REQUIREMENTS.find((r) => r.id === "assistant_coach")?.required === 1, "én assistenttrener kreves");
check(STAFF_ROLE_REQUIREMENTS.find((r) => r.id === "training_coach")?.required === 3, "tre trenere kreves");
check(STAFF_ROLE_REQUIREMENTS.find((r) => r.id === "physio")?.required === 1, "én fysio kreves");
check(STAFF_ROLE_REQUIREMENTS.find((r) => r.id === "goalkeeper_coach")?.required === 1, "én keepertrener kreves");

const starters = selectStarterStaffCandidates(staff);
const starterSummary = summarizeStaffRoster(starters);
check(starters.length === 6, "startgulvet velger seks rollekompatible stabsprofiler");
check(starterSummary.complete, "startgulvet dekker alle fire rollefamilier");
check(starters.every((member) => member.isPlaceholder === true), "startgulvet bruker bare eksplisitte plassholderprofiler, ikke virkelige trenere gratis");

const threeCoaches = [
  { id: "a", name: "A", staffType: "coach", canBeHiredAs: ["coach"] },
  { id: "b", name: "B", staffType: "coach", canBeHiredAs: ["coach"] },
  { id: "c", name: "C", staffType: "coach", canBeHiredAs: ["coach"] }
];
const incomplete = summarizeStaffRoster(threeCoaches);
check(!incomplete.complete, "tre vilkårlige trenere er ikke lenger en komplett stab");
check(incomplete.byRole.find((role) => role.id === "training_coach")?.filled === 3, "tre trenere fyller bare trenerplassene");
check(incomplete.missing.some((role) => role.id === "assistant_coach"), "manglende assistent oppdages");
check(incomplete.missing.some((role) => role.id === "physio"), "manglende fysio oppdages");
check(incomplete.missing.some((role) => role.id === "goalkeeper_coach"), "manglende keepertrener oppdages");

const assignments = assignFirstTeamStaff(starters);
check(assignments.filter((entry) => entry.staffId).length === 6, "seks unike rolleplasser tildeles deterministisk");
check(new Set(assignments.filter((entry) => entry.staffId).map((entry) => entry.staffId)).size === 6, "samme person kan ikke fylle to plasser");
const decorated = decorateHiredStaffWithAssignments(starters);
check(decorated.filter((member) => member.assignedStaffRole).length === 6, "hired staff sendes videre med faktisk tildelt rolle");
check(decorated.some((member) => member.staffType === "physio"), "coach-context mottar fysiorollen");
check(decorated.some((member) => member.staffType === "goalkeeper_coach"), "coach-context mottar keepertrenerrollen");

console.log(`\n${checks}/${checks} staff-roster-sjekker bestått.`);
'''
          (root / 'scripts/simulate-manager-staff-roster-v1.mjs').write_text(sim, encoding='utf-8')

          audit = r'''import fs from "node:fs";
import assert from "node:assert/strict";
const read = (path) => fs.readFileSync(new URL(`../${path}`, import.meta.url), "utf8");
const app = read("src/app.js");
const shell = read("src/ui/manager-shell-view.js");
const ui = read("src/ui/manager-staff-workspace-v1.js");
const module = read("src/football-staff-roster.js");
const pkg = JSON.parse(read("package.json"));
const staff = JSON.parse(read("data/football_staff.json")).staff || [];
const ci = read(".github/workflows/ci.yml");
let checks = 0;
function check(value, message) { assert.ok(value, message); checks += 1; console.log(`✓ ${checks}. ${message}`); }
check(app.includes('const REQUIRED_STAFF_SIZE = 6;'), "appens gamle 0/3-krav er erstattet med seks roller");
check(!app.includes('const REQUIRED_STAFF_SIZE = 3;'), "tre-personers stabsport er borte");
check(app.includes('summarizeStaffRoster(getHiredStaff())'), "før-sesong bruker rolledekning som sannhet");
check(app.includes('decorateHiredStaffWithAssignments(hired)'), "coach-context får den rollen personen faktisk fyller");
check(app.includes('selectStarterStaffCandidates(staff)'), "startgulvet er rollebasert");
check(module.includes('required: 3') && module.includes('goalkeeper_coach') && module.includes('physio'), "ren modell låser 1+3+1+1-kontrakten");
check(shell.includes('manager-staff-workspace-v1.js'), "stabsflaten lastes gjennom manager shell");
check(ui.includes('Førstelagsstab') && ui.includes('staff-role-grid'), "Stab & drift viser konkrete rolleplasser");
check(staff.filter((member) => member.starterStaff === true).length >= 6, "seks eksplisitte starter-stabsprofiler finnes");
check(staff.some((member) => member.staffType === 'physio'), "stabsdata har fysio-kandidat");
check(staff.some((member) => member.staffType === 'goalkeeper_coach'), "stabsdata har keepertrener-kandidat");
check(staff.filter((member) => member.starterStaff === true).every((member) => member.isPlaceholder === true), "starterstaben dikter ikke om virkelige personer");
check(pkg.scripts['audit:manager-staff-roster-v1'], "permanent stabs-audit er registrert");
check(pkg.scripts['sim:manager-staff-roster-v1'], "permanent stabs-simulering er registrert");
check(ci.includes('audit:manager-staff-roster-v1') && ci.includes('sim:manager-staff-roster-v1'), "CI kjører begge stabsportene");
check(!app.includes('done: hiredStaff >= REQUIRED_STAFF_SIZE'), "ingen før-sesongsgate godtar seks feil roller");
console.log(`\n${checks}/${checks} staff-roster-auditsjekker bestått.`);
'''
