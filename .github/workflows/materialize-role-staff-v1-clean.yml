name: Materialize clean role-based staff roster v1

on:
  push:
    branches:
      - agent/staff-roster-v1-clean
    paths:
      - .github/workflows/materialize-role-staff-v1-clean.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: agent/staff-roster-v1-clean
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Materialize permanent implementation
        run: python .github/materialize-role-staff-v1.py

      - name: Install dependencies
        run: npm ci

      - name: Verify staff implementation before commit
        run: |
          npm run audit:manager-staff-roster-v1
          npm run sim:manager-staff-roster-v1
          npm run check:syntax

      - name: Commit permanent implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout HEAD -- .github/workflows/ci.yml
          git rm .github/materialize-role-staff-v1.py
          git rm .github/workflows/materialize-role-staff-v1-clean.yml
          git add src data scripts tests docs package.json
          git diff --cached --check
          git commit -m "Build role-based first-team staff roster v1"
          git push origin HEAD:agent/staff-roster-v1-clean
