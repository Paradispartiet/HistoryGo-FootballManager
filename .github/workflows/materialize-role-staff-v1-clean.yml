          docs = '''# Rollebasert førstelagsstab v1\n\nFør seriestart trenger klubben seks konkrete roller: **1 assistenttrener, 3 trenere, 1 fysio og 1 keepertrener**. Dette er en integrasjon over eksisterende `data/hgFootball/staffRoles.json`, stabsdata og coach-context — ikke en ny parallell stabsmotor.\n\n`hiredStaffIds` forblir lagringens sannhetskilde. `football-staff-roster.js` fordeler de engasjerte personene deterministisk på kompatible rolleplasser. Dermed kan seks personer med feil kompetansesammensetning aldri passere før-sesongsgaten. De tildelte rollene mates videre inn i eksisterende coach-context.\n\nNye saves får et nøytralt, rollekomplett starter-utvalg av eksplisitte plassholderprofiler slik at spillet ikke får en dead end uten History Go. Plassholderne er tydelig merket `isPlaceholder`/`needsResearch`; de er ikke påstander om virkelige personer. History Go-opplåst stab fortsetter å komme fra eksisterende stedskoblinger.\n'''
          (root / 'docs/STAFF_ROSTER_V1.md').write_text(docs, encoding='utf-8')

          pkg_path = root / 'package.json'
          pkg = json.loads(pkg_path.read_text(encoding='utf-8'))
          pkg['scripts']['audit:manager-staff-roster-v1'] = 'node scripts/audit-manager-staff-roster-v1.mjs'
          pkg['scripts']['sim:manager-staff-roster-v1'] = 'node scripts/simulate-manager-staff-roster-v1.mjs'
          pkg_path.write_text(json.dumps(pkg, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          ci_path = root / '.github/workflows/ci.yml'
          ci = ci_path.read_text(encoding='utf-8')
          audit_anchor = '          npm run audit:manager-calendar-v1\n'
          if 'audit:manager-staff-roster-v1' not in ci:
            if audit_anchor not in ci: raise SystemExit('CI audit anchor missing')
            ci = ci.replace(audit_anchor, audit_anchor + '          npm run audit:manager-staff-roster-v1\n', 1)
          sim_anchor = '          npm run sim:manager-calendar-v1\n'
          if 'sim:manager-staff-roster-v1' not in ci:
            if sim_anchor not in ci: raise SystemExit('CI sim anchor missing')
            ci = ci.replace(sim_anchor, sim_anchor + '          npm run sim:manager-staff-roster-v1\n', 1)
          ci_path.write_text(ci, encoding='utf-8')
