name: Materialize clean role-based staff roster v1

on:
  push:
    branches: [agent/staff-roster-v1-clean]
    paths: [.github/workflows/materialize-role-staff-v1-clean.yml]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/staff-roster-v1-clean
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build permanent staff roster implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          root = Path('.')

          module = r'''// HG Football Manager — Role-based first-team staff roster v1
// Pure deterministic model. No DOM, storage or network access.

export const STAFF_ROLE_REQUIREMENTS = Object.freeze([
  Object.freeze({ id: "assistant_coach", label: "Assistenttrener", required: 1, acceptedTypes: Object.freeze(["assistant_coach"]) }),
  Object.freeze({ id: "training_coach", label: "Trener", required: 3, acceptedTypes: Object.freeze(["training_coach", "coach", "physical_coach"]) }),
  Object.freeze({ id: "physio", label: "Fysio", required: 1, acceptedTypes: Object.freeze(["physio"]) }),
  Object.freeze({ id: "goalkeeper_coach", label: "Keepertrener", required: 1, acceptedTypes: Object.freeze(["goalkeeper_coach", "former_goalkeeper_goalkeeper_coach"]) })
]);

export const REQUIRED_FIRST_TEAM_STAFF = STAFF_ROLE_REQUIREMENTS.reduce((sum, role) => sum + role.required, 0);

function asArray(value) {
  return Array.isArray(value) ? value : [];
}

function staffId(member) {
  return member?.id == null ? "" : String(member.id);
}

export function getStaffCandidateTypes(member) {
  const types = new Set();
  if (member?.staffType) types.add(String(member.staffType));
  asArray(member?.canBeHiredAs).forEach((type) => {
    if (type) types.add(String(type));
  });
  return [...types];
}

export function canStaffFillRole(member, roleId) {
  const requirement = STAFF_ROLE_REQUIREMENTS.find((role) => role.id === roleId);
  if (!requirement || !staffId(member)) return false;
  const types = new Set(getStaffCandidateTypes(member));
  return requirement.acceptedTypes.some((type) => types.has(type));
}

function expandedSlots() {
  return STAFF_ROLE_REQUIREMENTS.flatMap((role) =>
    Array.from({ length: role.required }, (_, index) => ({
      id: `${role.id}:${index + 1}`,
      roleId: role.id,
      label: role.label,
      index
    }))
  );
}

function preferenceScore(member, roleId) {
  const type = String(member?.staffType || "");
  if (type === roleId) return 100;
  if (roleId === "training_coach" && type === "coach") return 90;
  if (roleId === "training_coach" && type === "physical_coach") return 80;
  if (asArray(member?.canBeHiredAs).includes(roleId)) return 75;
  if (roleId === "training_coach" && asArray(member?.canBeHiredAs).includes("coach")) return 65;
  return 50;
}

function assignmentKey(assignments) {
  return assignments
    .map((entry) => `${entry.slotId}=${entry.staffId || "~"}`)
    .join("|");
}

export function assignFirstTeamStaff(staff = []) {
  const candidates = asArray(staff)
    .filter((member) => staffId(member))
    .slice()
    .sort((a, b) => staffId(a).localeCompare(staffId(b)));
  const slots = expandedSlots();
  let best = { filled: -1, preference: -1, key: "", assignments: [] };

  function visit(slotIndex, used, assignments, filled, preference) {
    if (slotIndex >= slots.length) {
      const key = assignmentKey(assignments);
      if (
        filled > best.filled ||
        (filled === best.filled && preference > best.preference) ||
        (filled === best.filled && preference === best.preference && (!best.key || key < best.key))
      ) {
        best = { filled, preference, key, assignments: assignments.map((entry) => ({ ...entry })) };
      }
      return;
    }

    const slot = slots[slotIndex];
    const eligible = candidates
      .filter((member) => !used.has(staffId(member)) && canStaffFillRole(member, slot.roleId))
      .sort((a, b) => {
        const score = preferenceScore(b, slot.roleId) - preferenceScore(a, slot.roleId);
        return score || staffId(a).localeCompare(staffId(b));
      });

    for (const member of eligible) {
      const id = staffId(member);
      used.add(id);
      assignments.push({ slotId: slot.id, roleId: slot.roleId, label: slot.label, staffId: id, member });
      visit(slotIndex + 1, used, assignments, filled + 1, preference + preferenceScore(member, slot.roleId));
      assignments.pop();
      used.delete(id);
    }

    assignments.push({ slotId: slot.id, roleId: slot.roleId, label: slot.label, staffId: null, member: null });
    visit(slotIndex + 1, used, assignments, filled, preference);
    assignments.pop();
  }

  visit(0, new Set(), [], 0, 0);
  return best.assignments;
}

export function summarizeStaffRoster(staff = []) {
  const assignments = assignFirstTeamStaff(staff);
  const byRole = STAFF_ROLE_REQUIREMENTS.map((requirement) => {
    const roleAssignments = assignments.filter((entry) => entry.roleId === requirement.id && entry.staffId);
    return {
      id: requirement.id,
      label: requirement.label,
      required: requirement.required,
      filled: roleAssignments.length,
      complete: roleAssignments.length >= requirement.required,
      staffIds: roleAssignments.map((entry) => entry.staffId),
      names: roleAssignments.map((entry) => entry.member?.name || entry.staffId)
    };
  });
  const filledCount = byRole.reduce((sum, role) => sum + role.filled, 0);
  const missing = byRole.filter((role) => !role.complete).map((role) => ({ ...role, missing: role.required - role.filled }));
  return {
    assignments,
    byRole,
    filledCount,
    requiredCount: REQUIRED_FIRST_TEAM_STAFF,
    complete: missing.length === 0,
    missing,
    missingLabel: missing.map((role) => `${role.label} ${role.filled}/${role.required}`).join(" · ")
  };
}

export function decorateHiredStaffWithAssignments(staff = []) {
  const assignments = assignFirstTeamStaff(staff);
  const roleById = new Map(assignments.filter((entry) => entry.staffId).map((entry) => [entry.staffId, entry.roleId]));
  return asArray(staff).map((member) => {
    const assignedStaffRole = roleById.get(staffId(member)) || null;
    return assignedStaffRole
      ? { ...member, originalStaffType: member.staffType || null, assignedStaffRole, staffType: assignedStaffRole }
      : { ...member, assignedStaffRole: null };
  });
}

export function selectStarterStaffCandidates(staff = []) {
  const starters = asArray(staff).filter((member) => member?.starterStaff === true && staffId(member));
  const summary = summarizeStaffRoster(starters);
  if (!summary.complete) return summary.assignments.filter((entry) => entry.member).map((entry) => entry.member);
  const selectedIds = new Set(summary.assignments.filter((entry) => entry.staffId).map((entry) => entry.staffId));
  return starters.filter((member) => selectedIds.has(staffId(member)));
}
'''
          (root / 'src/football-staff-roster.js').write_text(module, encoding='utf-8')

          ui = r'''import { STAFF_ROLE_REQUIREMENTS, summarizeStaffRoster } from "../football-staff-roster.js";

const MERITS_KEY = "hgfm.teamMerits.v1";
const SURFACE_ID = "managerStaffRosterV1";
const STYLE_ID = "managerStaffRosterV1Style";
let staffCatalogue = [];
let lastSignature = "";

function readMerits() {
  try {
    const parsed = JSON.parse(localStorage.getItem(MERITS_KEY) || "{}");
    return parsed && typeof parsed === "object" ? parsed : {};
  } catch {
    return {};
  }
}

function ensureStyles() {
  if (document.getElementById(STYLE_ID)) return;
  const link = document.createElement("link");
  link.id = STYLE_ID;
  link.rel = "stylesheet";
  link.href = new URL("./manager-staff-workspace-v1.css", import.meta.url).href;
  document.head.append(link);
}

function element(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text != null) node.textContent = text;
  return node;
}

function currentHiredStaff() {
  const merits = readMerits();
  const ids = new Set(Array.isArray(merits.hiredStaffIds) ? merits.hiredStaffIds.map(String) : []);
  return staffCatalogue.filter((member) => ids.has(String(member.id)));
}

function ensureSurface() {
  const section = document.querySelector('[data-tab-section="admin"]');
  if (!section) return null;
  let surface = document.getElementById(SURFACE_ID);
  if (surface) return surface;
  surface = element("section", "manager-staff-roster-v1");
  surface.id = SURFACE_ID;
  surface.setAttribute("aria-labelledby", "managerStaffRosterTitle");
  section.prepend(surface);
  return surface;
}

function roleCard(role) {
  const card = element("article", "staff-role-slot");
  card.dataset.complete = role.complete ? "true" : "false";
  const top = element("div", "staff-role-slot-head");
  top.append(element("strong", "", role.label), element("span", "staff-role-count", `${role.filled}/${role.required}`));
  card.append(top);
  if (role.names.length) {
    const list = element("ul", "staff-role-names");
    role.names.forEach((name) => list.append(element("li", "", name)));
    card.append(list);
  } else {
    card.append(element("p", "staff-role-missing", "Ledig rolle"));
  }
  return card;
}

export function renderManagerStaffRoster() {
  if (!staffCatalogue.length) return;
  ensureStyles();
  const surface = ensureSurface();
  if (!surface) return;
  const hired = currentHiredStaff();
  const signature = hired.map((member) => member.id).sort().join("|");
  if (signature === lastSignature && surface.childElementCount) return;
  lastSignature = signature;
  const summary = summarizeStaffRoster(hired);
  surface.textContent = "";
  surface.dataset.complete = summary.complete ? "true" : "false";

  const head = element("header", "staff-roster-head");
  const copy = element("div");
  copy.append(
    element("p", "eyebrow", "Kontor · Klubbdrift · Stab & drift"),
    element("h2", "", "Førstelagsstab"),
    element("p", "muted-text", "Klubben trenger konkrete roller rundt laget. Tilgjengelig stab må engasjeres før de teller i disse plassene.")
  );
  const count = element("strong", "staff-roster-total", `${summary.filledCount}/${summary.requiredCount} roller`);
  head.append(copy, count);

  const grid = element("div", "staff-role-grid");
  summary.byRole.forEach((role) => grid.append(roleCard(role)));
  const footer = element("p", "staff-roster-status");
  footer.setAttribute("aria-live", "polite");
  footer.textContent = summary.complete
    ? "Førstelagsstaben er komplett: assistenttrener, tre trenere, fysio og keepertrener."
    : `Mangler: ${summary.missingLabel || "roller i støtteapparatet"}.`;
  surface.append(head, grid, footer);
}

async function loadStaff() {
  try {
    const response = await fetch(new URL("../../data/football_staff.json", import.meta.url));
    const data = await response.json();
    staffCatalogue = Array.isArray(data?.staff) ? data.staff : [];
    renderManagerStaffRoster();
  } catch (error) {
    console.warn("Kunne ikke laste stabsoversikten", error);
  }
}

function scheduleRender() {
  window.setTimeout(() => {
    lastSignature = "";
    renderManagerStaffRoster();
  }, 0);
}

window.addEventListener("hgfm:team-merits-changed", scheduleRender);
window.addEventListener("storage", (event) => { if (event.key === MERITS_KEY) scheduleRender(); });
document.addEventListener("click", (event) => {
  if (event.target?.closest?.('[data-tab-section="admin"], [data-club-target="admin"]')) scheduleRender();
}, true);

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", loadStaff, { once: true });
} else {
  loadStaff();
}

export { STAFF_ROLE_REQUIREMENTS };
'''
