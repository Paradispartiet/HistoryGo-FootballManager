name: Temporary fix manager club label

on:
  push:
    branches:
      - agent/manager-club-scene-v1
    paths:
      - .github/workflows/temp-fix-manager-club-label.yml

permissions:
  contents: write

jobs:
  fix-label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/manager-club-scene-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply unique club overview label
        run: python scripts/temp-fix-manager-club-label.py
      - name: Install dependencies
        run: npm ci
      - name: Verify static contracts
        run: |
          npm run check:syntax
          npm run check:dom-ids
          npm run audit:dead-ends
          npm run audit:manager-club-scene-v1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify club browser contract
        run: npx playwright test tests/browser/manager-club-scene-v1.spec.js --project=chromium
      - name: Commit and push label fix
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html docs/MANAGER_CLUB_SCENE_V1.md scripts/audit-manager-club-scene-v1.mjs tests/browser/manager-club-scene-v1.spec.js
          git diff --cached --name-status
          git commit -m "Gi klubboversikten en unik navigasjonsetikett"
          git push origin HEAD:agent/manager-club-scene-v1
