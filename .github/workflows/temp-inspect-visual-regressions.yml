name: Temporary inspect visual regressions

on:
  push:
    branches:
      - agent/manager-matchday-scene-v1
    paths:
      - .github/workflows/temp-inspect-visual-regressions.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/manager-matchday-scene-v1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Reproduce visual differences
        continue-on-error: true
        run: >-
          npx playwright test
          tests/browser/manager-office-inbox-v1.spec.js
          tests/browser/manager-training-scene-v2.spec.js
          --project=chromium
          --grep "visuell baseline|768px-baseline"

      - name: Collect expected baselines
        if: always()
        run: |
          mkdir -p visual-inspection/expected
          cp tests/browser/manager-office-inbox-v1.spec.js-snapshots/office-768-chromium-linux.png visual-inspection/expected/
          cp tests/browser/manager-training-scene-v2.spec.js-snapshots/training-768-chromium-linux.png visual-inspection/expected/
          cp -R test-results visual-inspection/test-results

      - name: Upload visual inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-inspection
          path: visual-inspection
          if-no-files-found: error
