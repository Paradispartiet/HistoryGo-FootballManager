name: Full-season injury RNG diagnostic

on:
  push:
    branches:
      - agent/diagnose-full-season-injury-rng-20260921
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: diagnose-${{ matrix.run }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run canonical full season with injury RNG isolated
        run: npx playwright test tests/browser/manager-career-full-season-playthrough-v1.spec.js --project=chromium-full-season --workers=1 --no-deps
