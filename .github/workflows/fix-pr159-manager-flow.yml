name: Fix PR159 manager flow simulation

on:
  push:
    branches:
      - agent/matchday-lineup-scenes-v1-clean
    paths:
      - .github/workflows/fix-pr159-manager-flow.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/matchday-lineup-scenes-v1-clean
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update manager-flow gate audit
        shell: python
        run: |
          from pathlib import Path

          path = Path("scripts/simulate-manager-flow-ui.mjs")
          source = path.read_text(encoding="utf-8")
          old = '  check("Kampfanen har tydelig kampdag-gate", app.includes("renderMatchdayGate") && app.includes("Kampklar:") && app.includes("Primærhandling:"));'
          new = '  check("Kampfanen har tydelig kampdag-gate", app.includes("renderMatchdayGate") && app.includes("createMatchdaySceneModel") && app.includes("scene.primaryAction") && app.includes("scene.statusLabel"));'
          if old not in source:
              raise SystemExit("Expected stale matchday gate assertion was not found")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")

      - name: Verify targeted simulation
        run: npm run sim:manager-flow-ui

      - name: Commit and push fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/simulate-manager-flow-ui.mjs
          git commit -m "Fix manager flow matchday gate audit"
          git push origin HEAD:agent/matchday-lineup-scenes-v1-clean
