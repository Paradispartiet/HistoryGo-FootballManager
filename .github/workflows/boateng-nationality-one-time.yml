name: Canonical Boateng nationality sync (one-time)
on:
  push:
    branches:
      - fix/boateng-canonical-nationality-20261021
permissions:
  contents: write
jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sync canonical Boateng nationality from club citizenship record
        run: node scripts/sync-boateng-nationality.mjs --write
      - name: Commit precisely the changed canonical player file
        run: |
          if ! git diff --quiet -- data/football_players.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/football_players.json
            git commit -m "Correct Boateng nationality on both canonical and legacy raw records"
            git push
          else
            echo "Canonical nationalities already synchronized"
          fi
