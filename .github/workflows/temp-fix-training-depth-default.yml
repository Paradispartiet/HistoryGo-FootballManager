name: Temporary fix training depth default

on:
  push:
    branches:
      - agent/manager-training-scene-v2
    paths:
      - .github/workflows/temp-fix-training-depth-default.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/manager-training-scene-v2
      - name: Apply folded default
        run: python scripts/temp-fix-training-depth-default.py
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.js
          git commit -m "Hold treningsdybden foldet ved første render"
          git push origin HEAD:agent/manager-training-scene-v2
