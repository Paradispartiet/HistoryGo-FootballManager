name: Temporary Molde batch final preflight
on:
  push:
    branches: [content/molde-affiliations-and-strengths-20261017]
    paths: [.github/workflows/molde-affiliations-produce-temporary.yml]
permissions: {contents: read}
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/molde-affiliations-and-strengths-20261017
      - name: Validate documented Molde affiliations, skills and coverage
        run: |
          node scripts/sync-club-affiliations.mjs
          node scripts/audit-source-depth-claims.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {applyP1SourceClaims} from './src/football-player-source-claims-p1.js';
          import {applyP2SourceClaims} from './src/football-player-source-claims-p2.js';
          import {applySourceDepthClaims} from './src/football-player-source-claims-depth.js';
          const ledger=JSON.parse(fs.readFileSync('data/research/molde-affiliations-2026-10-17.json','utf8'));
          const raw=JSON.parse(fs.readFileSync('data/football_players.json','utf8')).players;
          const players=applySourceDepthClaims(applyP2SourceClaims(applyP1SourceClaims(raw)));
          let verified=0;
          for(const {playerId} of ledger.entries){
            const p=players.find(p=>p.id===playerId);
            assert.ok(p,'missing: '+playerId);
            const a=p.clubAffiliations?.find(a=>a.clubId==='molde');
            assert.ok(a && a.source==='belagt' && a.relation==='played_for','unbelagt: '+playerId);
            verified++;
          }
          for(const id of ['mohamed_elyounoussi','ola_brynhildsen','david_datro_fofana','knut_olav_rindaroy','pape_pate_diouf','martin_linnes','rob_friend','baye_djiby_fall']){
            const p=players.find(p=>p.id===id);
            console.log('STRENGTH '+JSON.stringify({id,strengths:p?.strengths,places:p?.sourcePlaceIds}));
            assert.ok(p?.strengths?.length>0,id+' no strengths');
          }
          const exclusive=players.filter(p=>p.sourcePlaceIds?.length===1&&p.sourcePlaceIds[0]==='aker_stadion');
          const missing=exclusive.filter(p=>!(p.strengths||[]).length);
          const cap=(Math.ceil(100*missing.length/exclusive.length)+1)/100;
          const pool=players.filter(p=>p.clubAffiliations?.some(a=>a.clubId==='molde'));
          console.log('MOLDE_RESULT '+JSON.stringify({verified,exclusive:exclusive.length,exclusiveMissing:missing.length,cap,poolTotal:pool.length,poolMissing:pool.filter(p=>!(p.strengths||[]).length).length}));
          NODE
